<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeChurchEazy Presentation</title>
  <link href="/fonts/google/google-fonts.css" rel="stylesheet" />
  <link href="/fonts/cmg-sans-fonts.css" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "Charis SIL";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/charis-sil/CharisSIL-Regular.ttf") format("truetype");
    }

    @font-face {
      font-family: "Charis SIL";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/charis-sil/CharisSIL-Bold.ttf") format("truetype");
    }

    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #f8fafc;
      --muted: #ffffff;
      --panel: rgba(15, 23, 42, 0.86);
      --border: rgba(148, 163, 184, 0.24);
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "CMG Sans Black", "CMG Sans", "Noto Sans", "Charis SIL", "Inter", "Segoe UI", sans-serif;
      position: relative;
    }

    .remote-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    .remote-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      transform: translate(-50%, -50%);
      aspect-ratio: 16 / 9;
      background: transparent;
      overflow: hidden;
    }

    .remote-stage.remote-stage--media {
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      transform: none;
      aspect-ratio: auto;
      border: none;
      margin: 0;
      padding: 0;
    }

    .stage-bg,
    .stage-bg img,
    .stage-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stage-bg img,
    .stage-bg video {
      object-fit: cover;
      background: #000;
    }

    .stage-bg .stage-pattern {
      object-fit: cover;
      background: transparent;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
    }

    .stage-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 4vw, 72px);
      transform-origin: center center;
    }

    .stage-content--lower-third {
      align-items: flex-end;
      padding-bottom: clamp(32px, 6vh, 80px);
    }

    .stage-content--lower-third .stage-box {
      max-width: min(1320px, 94%);
      background: rgba(0, 0, 0, 0.78);
      border-radius: 14px;
      padding: clamp(16px, 2.5vw, 28px) clamp(24px, 3.5vw, 44px) !important;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .stage-box {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: min(1440px, 100%);
      width: 100%;
      text-align: center;
      white-space: pre-wrap;
    }

    .stage-box.align-left {
      text-align: left;
      align-items: flex-start;
    }

    .stage-box.align-center {
      text-align: center;
      align-items: center;
      width: 100%;
      max-width: none;
    }

    .stage-box.align-right {
      text-align: right;
      align-items: flex-end;
    }

    .stage-reference {
      font-size: clamp(28px, 2.2vw, 42px);
      font-weight: inherit;
      color: #ffffff;
    }

    .stage-title {
      font-size: clamp(46px, 4vw, 90px);
      font-weight: inherit;
      line-height: 1.08;
    }

    .stage-subtitle {
      font-size: clamp(30px, 2.4vw, 48px);
      color: #ffffff;
    }

    .stage-body {
      font-size: clamp(68px, 6.8vw, 156px);
      font-weight: inherit;
      line-height: 1.2;
    }

    .stage-box--compare {
      max-width: min(1840px, 100%);
      width: 100%;
    }

    .stage-compare {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      column-gap: clamp(16px, 5vw, 96px);
      row-gap: clamp(8px, 1.4vw, 18px);
      width: 100%;
      align-items: center;
      text-align: center;
      white-space: normal;
    }

    .stage-compare-reference {
      justify-self: center;
      line-height: 1.15;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      white-space: normal;
    }

    .stage-compare-text {
      min-width: 0;
      line-height: 1.2;
      font-weight: 700;
      color: inherit;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .media-layer,
    .media-layer img,
    .media-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
    }

    .media-layer img,
    .media-layer video {
      object-position: center center;
      background: transparent;
    }

    .countdown-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
    }

    .countdown-clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(100px, 11vw, 240px);
      line-height: 1;
      font-weight: 800;
    }

    .countdown-message {
      font-size: clamp(20px, 1.8vw, 34px);
      color: var(--muted);
    }

    .ticker-layer {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .ticker-layer.ticker-top {
      top: 0;
    }

    .ticker-layer.ticker-bottom {
      bottom: 0;
    }

    .ticker-bar {
      width: 100%;
      padding: 14px 0;
      white-space: nowrap;
      overflow: hidden;
    }

    .ticker-track {
      display: inline-block;
      padding-inline: 4vw;
      will-change: transform;
    }

    .ticker-track.ticker-rtl {
      animation-name: ticker-rtl;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .ticker-track.ticker-ltr {
      animation-name: ticker-ltr;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .ticker-track.ticker-static {
      display: block;
      text-align: center;
    }

    .ticker-paused {
      animation-play-state: paused !important;
    }

    .waiting-state,
    .invalid-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #000;
    }

    .state-card {
      max-width: min(620px, 100%);
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      padding: 30px 34px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
    }

    .state-title {
      font-size: 28px;
      font-weight: 700;
    }

    .state-copy {
      margin-top: 10px;
      font-size: 16px;
      color: var(--muted);
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    /* Broadcast graphic (lower third) layer — sent from the Dock in presentation-link mode. */
    .graphic-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 8;
      pointer-events: none;
      background: transparent;
      color-scheme: normal;
    }

    .graphic-layer.hidden {
      display: none;
    }

    .zoom-indicator {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #f0f0f5;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .zoom-indicator.hidden {
      opacity: 0;
    }

    @keyframes ticker-rtl {
      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(-100%);
      }
    }

    @keyframes ticker-ltr {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100%);
      }
    }
  </style>
<style id="mce-no-video-ui">
/* Never show the browser's own play button or video controls (the overlay plays its videos itself). */
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-play-button { display: none !important; opacity: 0 !important; visibility: hidden !important; -webkit-appearance: none !important; pointer-events: none !important; }
video { outline: none; }
</style>
</head>

<body>
  <div class="remote-screen">
    <div id="waitingState" class="waiting-state hidden">
      <div class="state-card">
        <div class="state-title">MakeChurchEazy Presentation</div>
        <div class="state-copy">Waiting for presentation content…</div>
      </div>
    </div>
    <div id="invalidState" class="invalid-state hidden">
      <div class="state-card">
        <div class="state-title">Presentation link is invalid</div>
        <div class="state-copy">Open the locally generated presentation link from MakeChurchEazy again.</div>
      </div>
    </div>
    <div id="stage" class="remote-stage"></div>
    <iframe id="graphicLayer" class="graphic-layer hidden" title="Broadcast graphic" scrolling="no" aria-hidden="true"></iframe>
    <div id="zoomIndicator" class="zoom-indicator hidden">100%</div>
  </div>

  <script>
    (function () {
      const body = document.body;
      const waitingState = document.getElementById("waitingState");
      const invalidState = document.getElementById("invalidState");
      const stage = document.getElementById("stage");
      const screen = document.querySelector(".remote-screen");
      const zoomIndicator = document.getElementById("zoomIndicator");
      let zoomIndicatorTimer = null;

      console.log("[presentation] page zoom loaded");

      // Simple page zoom (like browser Ctrl+/-)
      let pageZoom = 1;
      const MIN_PAGE_ZOOM = 0.5;
      const MAX_PAGE_ZOOM = 2;
      const PAGE_ZOOM_STEP = 0.1;

      function showZoomIndicator() {
        if (!zoomIndicator) return;
        zoomIndicator.textContent = `${Math.round(pageZoom * 100)}%`;
        zoomIndicator.classList.remove("hidden");
        if (zoomIndicatorTimer) window.clearTimeout(zoomIndicatorTimer);
        zoomIndicatorTimer = window.setTimeout(function () {
          zoomIndicator.classList.add("hidden");
          zoomIndicatorTimer = null;
        }, 1500);
      }

      function applyPageZoom() {
        console.log("[presentation] applyPageZoom:", pageZoom);
        if (!screen) { console.warn("[presentation] screen not found"); return; }
        if (pageZoom === 1) {
          screen.style.transform = "";
          return;
        }
        screen.style.transformOrigin = "center center";
        screen.style.transform = `scale(${pageZoom})`;
      }

      function resetPageZoom() {
        pageZoom = 1;
        applyPageZoom();
        showZoomIndicator();
      }

      function handleZoomKeydown(e) {
        if (e.ctrlKey || e.metaKey) return;
        let changed = false;
        switch (e.key) {
          case "+":
          case "=":
            pageZoom = Math.min(MAX_PAGE_ZOOM, pageZoom + PAGE_ZOOM_STEP);
            changed = true;
            break;
          case "-":
          case "_":
            pageZoom = Math.max(MIN_PAGE_ZOOM, pageZoom - PAGE_ZOOM_STEP);
            changed = true;
            break;
          case "0":
            resetPageZoom();
            return;
        }
        if (changed) {
          applyPageZoom();
          showZoomIndicator();
        }
      }

      function handleZoomWheel(e) {
        if (!e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        if (e.deltaY < 0) {
          pageZoom = Math.min(MAX_PAGE_ZOOM, pageZoom + PAGE_ZOOM_STEP);
        } else {
          pageZoom = Math.max(MIN_PAGE_ZOOM, pageZoom - PAGE_ZOOM_STEP);
        }
        applyPageZoom();
        showZoomIndicator();
      }

      let sessionId = "";
      let wsPort = 0;
      let viewerId = "";
      let socket = null;
      let reconnectTimer = null;
      let reconnectAttempt = 0;
      let heartbeatTimer = null;
      let pollTimer = null;
      let countdownTimer = null;
      let lastResolvedState = undefined;
      const initialParams = new URLSearchParams(window.location.search);
      const isPreviewFrame = initialParams.get("preview") === "1";
      const PREVIEW_MAX_FONT_SIZE = 75;
      const PREVIEW_DEFAULT_FONT_SIZE = 50;
      // vMix's Web Browser input: `transparent=1` keeps the page see-through when
      // empty, and `outDelay` keeps cleared content up while vMix transitions the overlay out.
      const transparentWhenEmpty = initialParams.get("transparent") === "1";
      const outDelayMs = Math.max(0, Math.min(5000, Number(initialParams.get("outDelay")) || 0));
      const emptyBackground = transparentWhenEmpty ? "transparent" : "#000";



      const reconnectDelays = [1000, 3000, 5000, 10000];

      function parseTokenFromPath() {
        const match = window.location.pathname.match(/\/p\/([^/?#]+)/i);
        return match ? decodeURIComponent(match[1]) : "";
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function getSessionId() {
        const params = new URLSearchParams(window.location.search);
        return parseTokenFromPath() || params.get("sessionId") || "";
      }

      function getViewerId() {
        if (!sessionId) return "";
        const key = `mce-presentation-viewer:${sessionId}`;
        try {
          const existing = sessionStorage.getItem(key);
          if (existing) return existing;
          const next = self.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : `viewer-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          sessionStorage.setItem(key, next);
          return next;
        } catch {
          return `viewer-${Date.now()}`;
        }
      }

      function clearCountdownTimer() {
        if (countdownTimer !== null) {
          window.clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function showInvalid() {
        if (stage) {
          stage.classList.remove("remote-stage--media");
          stage.style.background = "transparent";
          stage.innerHTML = "";
        }
        if (body) {
          body.style.background = emptyBackground;
        }
        if (transparentWhenEmpty) return;
        invalidState.classList.remove("hidden");
        waitingState.classList.add("hidden");
      }

      function showWaiting() {
        if (stage) {
          stage.classList.remove("remote-stage--media");
          stage.style.background = "transparent";
          stage.innerHTML = "";
        }
        if (body) {
          body.style.background = emptyBackground;
        }
        invalidState.classList.add("hidden");
        if (transparentWhenEmpty) return;
        waitingState.classList.remove("hidden");
      }

      function showBlank() {
        if (stage) {
          stage.classList.remove("remote-stage--media");
          stage.style.background = "transparent";
          stage.innerHTML = "";
        }
        invalidState.classList.add("hidden");
        waitingState.classList.add("hidden");
        if (body) {
          body.style.background = emptyBackground;
        }
      }

      function getContentUrl(value) {
        const trimmed = String(value || "").trim();
        if (!trimmed) return "";
        if (trimmed.startsWith("http://") || trimmed.startsWith("https://") || trimmed.startsWith("data:") || trimmed.startsWith("blob:")) {
          return trimmed;
        }
        if (trimmed.startsWith("/")) {
          return trimmed;
        }
        return `/${trimmed.replace(/^\/+/, "")}`;
      }

      function getStyle(item) {
        return item && item.style ? item.style : {};
      }

      function getOutputViewportScale() {
        const widthScale = (window.innerWidth || 1280) / 1280;
        const heightScale = (window.innerHeight || 720) / 720;
        const scale = Math.min(widthScale, heightScale);
        if (!Number.isFinite(scale)) return 1;
        return Math.max(0.32, Math.min(1, scale));
      }

      function isTransparentColor(value) {
        const normalized = String(value || "").trim().toLowerCase().replace(/\s+/g, "");
        return !normalized ||
          normalized === "transparent" ||
          normalized === "#0000" ||
          normalized === "#00000000" ||
          normalized === "rgba(0,0,0,0)";
      }

      function normalizeGradientAngle(value) {
        const angle = Number(value);
        if (!Number.isFinite(angle)) return 180;
        return Math.max(0, Math.min(360, angle));
      }

      function getStageBackground(style) {
        const backgroundType = String(style.backgroundType || "").trim().toLowerCase();
        const bgImage = getContentUrl(style.backgroundImage);
        const bgVideo = getContentUrl(style.backgroundVideo);
        const bgPattern = getContentUrl(style.backgroundPattern);
        if (backgroundType === "off") return "transparent";

        const start = String(style.backgroundColor || "").trim();
        const end = String(style.backgroundColorEnd || "").trim();
        const hasStart = !isTransparentColor(start);
        const hasEnd = !isTransparentColor(end);
        const sameColor = start.trim().toLowerCase() === end.trim().toLowerCase();

        if (hasStart && hasEnd && !sameColor) {
          return `linear-gradient(${normalizeGradientAngle(style.bgGradientAngle)}deg, ${start}, ${end})`;
        }
        if (hasStart) return start;
        if (hasEnd) return end;
        if (bgImage || bgVideo || bgPattern) return "transparent";
        return "#000000";
      }

      function getPresentationZoom(item) {
        const zoom = Number(item && item.meta ? item.meta.zoom : 1);
        if (!Number.isFinite(zoom)) return 1;
        return Math.max(0.8, Math.min(1.8, zoom));
      }

      function zoomClamp(minPx, viewportVw, maxPx, zoom) {
        return `clamp(${Math.round(minPx * zoom)}px, ${(viewportVw * zoom).toFixed(2)}vw, ${Math.round(maxPx * zoom)}px)`;
      }

      function getPreviewTextFontSize(value) {
        const raw = Number(value);
        if (!isPreviewFrame) return raw;
        if (!Number.isFinite(raw) || raw <= 0) return PREVIEW_DEFAULT_FONT_SIZE;
        return Math.max(24, Math.min(PREVIEW_MAX_FONT_SIZE, raw));
      }

      function formatScaledTextSize(size, zoom) {
        const scaled = Math.round(size * zoom);
        return `${isPreviewFrame ? Math.min(PREVIEW_MAX_FONT_SIZE, scaled) : scaled}px`;
      }

      function fitBibleTextSize(text, requestedSize, style, viewportScale, overlayOpacity) {
        const stageWidth = stage && stage.clientWidth ? stage.clientWidth : (window.innerWidth || 1280);
        const stageHeight = stage && stage.clientHeight ? stage.clientHeight : (window.innerHeight || 720);
        const outerPadding = Math.max(4, Math.round(Number(style.safeArea || style.padding || 48) * viewportScale));
        const boxPadding = overlayOpacity > 0 ? Math.max(12, Number(style.padding || 24)) : 0;
        const availableWidth = Math.max(240, stageWidth - (outerPadding + boxPadding) * 2);
        const availableHeight = Math.max(180, stageHeight - (outerPadding + boxPadding) * 2);
        const lineHeight = Math.max(1, Number(style.lineHeight || 1.2));
        let size = Math.max(30, Number(requestedSize) || 72);
        const content = String(text || "").trim();
        if (!content) return size;

        // Estimate wrapping from the rendered width and step down until the
        // complete verse fits inside the 16:9 stage instead of being clipped.
        for (let attempt = 0; attempt < 10; attempt += 1) {
          const charsPerLine = Math.max(8, Math.floor(availableWidth / (size * 0.56)));
          const lineCount = Math.max(1, content.split("\n").reduce(function (total, line) {
            return total + Math.max(1, Math.ceil(line.length / charsPerLine));
          }, 0));
          if (lineCount * size * lineHeight <= availableHeight) return Math.round(size);
          size *= 0.88;
        }
        return Math.round(Math.max(30, size));
      }

      function getBibleCompareColumns(item) {
        const compare = item && item.bibleCompare;
        if (!compare || !Array.isArray(compare.columns)) return [];
        return compare.columns
          .map(function (column) {
            const reference = String(column && column.reference || "").trim();
            const translation = String(column && column.translation || "").trim();
            const text = String(column && column.text || "").trim();
            if (!text) return null;
            return {
              reference,
              translation,
              text,
            };
          })
          .filter(Boolean)
          .slice(0, 3);
      }

      function renderBibleCompareMarkup(columns, bodySize, referenceSize) {
        if (columns.length < 2) return "";
        const columnCount = Math.max(2, Math.min(3, columns.length));
        return `
          <div class="stage-compare" style="grid-template-columns:repeat(${columnCount}, minmax(0, 1fr));">
            ${columns.map(function (column) {
              const label = [column.reference, column.translation ? `(${column.translation})` : ""].filter(Boolean).join(" ");
              return `<div class="stage-compare-reference" style="font-size:${referenceSize};">${escapeHtml(label)}</div>`;
            }).join("")}
            ${columns.map(function (column) {
              return `<div class="stage-compare-text" style="font-size:${bodySize};">${escapeHtml(column.text)}</div>`;
            }).join("")}
          </div>
        `;
      }

      function renderTextLayer(item, isLowerThird) {
        const style = getStyle(item);
        const viewportScale = getOutputViewportScale();
        const zoom = getPresentationZoom(item) * viewportScale;
        const meta = item.meta || {};
        const alignClass = `align-${style.textAlign || "center"}`;
        const rawFontSize = Number(style.fontSize || 0);
        const effectiveFontSize = isPreviewFrame ? getPreviewTextFontSize(rawFontSize) : rawFontSize;
        const isBible = item.source === "bible";
        const baseBodySize = effectiveFontSize
          ? isPreviewFrame
            ? effectiveFontSize
            : isBible
              ? Math.min(96, Math.max(48, effectiveFontSize * 1.15))
              : Math.max(68, effectiveFontSize * 1.45)
          : 0;
        const titleSize = baseBodySize
          ? formatScaledTextSize(Math.max(42, baseBodySize * 0.58), zoom)
          : zoomClamp(46, 4, 90, zoom);
        const subtitleSize = baseBodySize
          ? formatScaledTextSize(Math.max(28, baseBodySize * 0.34), zoom)
          : zoomClamp(30, 2.4, 48, zoom);
        const referenceSize = baseBodySize
          ? formatScaledTextSize(Math.max(24, baseBodySize * 0.28), zoom)
          : zoomClamp(28, 2.2, 42, zoom);
        const compareFontSize = effectiveFontSize || rawFontSize;
        const compareBodySize = compareFontSize
          ? formatScaledTextSize(Math.max(28, Math.min(54, compareFontSize)), zoom)
          : zoomClamp(28, 3, 54, zoom);
        const compareReferenceSize = compareFontSize
          ? formatScaledTextSize(Math.max(18, Math.min(28, compareFontSize * 0.52)), zoom)
          : referenceSize;
        const contentPadding = Math.max(4, Math.round(Number(style.safeArea || style.padding || 48) * viewportScale));
        const bodyColor = style.textColor || "#ffffff";
        const boxOpacity = Number(style.overlayOpacity || 0);
        const backgroundOpacity = Math.max(0, Math.min(1, Number(style.backgroundOpacity == null ? 1 : style.backgroundOpacity)));
        const overlayOpacity = Math.max(0, Math.min(1, Number(style.overlayOpacity || 0)));
        const overlayColor = style.overlayColor || "#000000";
        const showReference = meta.showReference !== false;
        const showTitle = meta.showTitle !== false;
        const showSubtitle = meta.showSubtitle !== false;
        const compareColumns = isBible ? getBibleCompareColumns(item) : [];
        const hasBibleCompare = compareColumns.length >= 2;
        const boxAlignClass = hasBibleCompare ? "align-center stage-box--compare" : alignClass;
        const requestedBodySize = (baseBodySize || (isBible ? 72 : 0)) * zoom;
        const fittedBodySize = isBible && item.body
          ? fitBibleTextSize(item.body, requestedBodySize, style, viewportScale, overlayOpacity)
          : requestedBodySize;
        const bodySize = fittedBodySize ? `${fittedBodySize}px` : "";

        const bgImage = getContentUrl(style.backgroundImage);
        const bgVideo = getContentUrl(style.backgroundVideo);
        const bgPattern = getContentUrl(style.backgroundPattern);
        const hasText = hasBibleCompare || item.body || (showTitle && item.title) || (showReference && item.reference) || (showSubtitle && item.subtitle);
        const contentClass = isLowerThird ? "stage-content stage-content--lower-third" : "stage-content";

        return `
          ${isLowerThird ? "" : `
          <div class="stage-bg" style="background:${escapeHtml(getStageBackground(style))};">
            ${bgPattern ? `<img class="stage-pattern" src="${escapeHtml(bgPattern)}" alt="" style="object-fit:cover;opacity:${backgroundOpacity};" />` : ""}
            ${bgImage ? `<img src="${escapeHtml(bgImage)}" alt="" style="object-fit:cover;opacity:${backgroundOpacity};" />` : ""}
            ${bgVideo ? `<video src="${escapeHtml(bgVideo)}" muted loop playsinline preload="auto" onloadeddata="try{this.play().catch(function(){})}catch(e){}" style="object-fit:cover;opacity:${backgroundOpacity};"></video>` : ""}
          </div>
          <div class="stage-overlay" style="background:${escapeHtml(overlayColor)};opacity:${overlayOpacity};"></div>
          `}
          ${hasText ? `
            <div class="${contentClass}" style="padding:${contentPadding}px;">
              <div class="stage-box ${boxAlignClass}" style="
                color:${escapeHtml(bodyColor)};
                font-family:${escapeHtml(style.fontFamily || '"Inter", "Segoe UI", sans-serif')};
                font-weight:${escapeHtml(String(style.fontWeight || 700))};
                line-height:${Math.max(1, Number(style.lineHeight || 1.2))};
                text-shadow:${escapeHtml(style.textShadow || "0 12px 40px rgba(0,0,0,0.45)")};
                ${style.textOutline ? `paint-order:stroke fill;-webkit-text-stroke:${Math.max(1, Number(style.textOutlineWidth || 2))}px ${escapeHtml(style.textOutlineColor || "#000000")};` : ""}
                border-radius:${Math.max(0, Number(style.padding || 0) * 0.25)}px;
                padding:${boxOpacity > 0 ? `${Math.max(12, Number(style.padding || 24))}px` : "0"};
                opacity:1;
              ">
                ${hasBibleCompare ? ""
                  : `${showReference && item.reference ? `<div class="stage-reference" style="font-size:${referenceSize};">${escapeHtml(item.reference)}</div>` : ""}
                ${showTitle && item.title ? `<div class="stage-title" style="font-size:${titleSize};">${escapeHtml(item.title)}</div>` : ""}
                ${showSubtitle && item.subtitle ? `<div class="stage-subtitle" style="font-size:${subtitleSize};">${escapeHtml(item.subtitle)}</div>` : ""}`}
                ${hasBibleCompare
                  ? renderBibleCompareMarkup(compareColumns, compareBodySize, compareReferenceSize)
                  : item.body ? `<div class="stage-body" style="font-size:${bodySize || (isBible ? zoomClamp(42, 3.2, 72, zoom) : zoomClamp(68, 6.8, 156, zoom))};">${escapeHtml(item.body)}</div>` : ""}
              </div>
            </div>
          ` : ""}
        `;
      }

      function getMediaFit(value) {
        switch (value) {
          case "stretch":
            return "fill";
          case "fit":
          case "contain":
            return "contain";
          case "cover":
          case "fill":
          default:
            return "cover";
        }
      }

      function syncVideoPlayback(video, playback) {
        if (!video || !playback) return;
        video.muted = Boolean(playback.muted);
        video.loop = Boolean(playback.loop);
        video.volume = Math.max(0, Math.min(1, Number(playback.volume == null ? 1 : playback.volume)));

        const desiredPosition = Number(playback.positionSeconds || 0);
        if (Number.isFinite(desiredPosition) && Math.abs(video.currentTime - desiredPosition) > 1.2) {
          try {
            video.currentTime = desiredPosition;
          } catch {
            // Ignore seek failures until metadata is ready.
          }
        }

        if (playback.playing === false) {
          video.pause();
        } else {
          video.play().catch(function () { });
        }
      }

      function renderMediaLayer(item) {
        const media = item.media || {};
        const fit = getMediaFit(media.fit);
        const background = media.backgroundColor || "#000000";
        const src = getContentUrl(media.url || item.imageUrl || item.videoUrl);
        const isVideo = media.kind === "video" || Boolean(item.videoUrl);
        const zoom = getPresentationZoom(item);
        const mediaZoomStyle = zoom !== 1 ? `transform:scale(${zoom});transform-origin:center center;` : "";

        return `
          <div class="media-layer" style="background:${escapeHtml(background)};">
            ${isVideo
              ? `<video id="stageVideo" src="${escapeHtml(src)}" muted loop playsinline preload="auto" onloadeddata="try{this.play().catch(function(){})}catch(e){}" style="object-fit:${fit};${mediaZoomStyle}"></video>`
              : `<img src="${escapeHtml(src)}" alt="${escapeHtml(item.title || "Presentation media")}" style="object-fit:${fit};${mediaZoomStyle}" />`}
          </div>
        `;
      }

      function calculateRemainingSeconds(payload) {
        if (!payload) return 0;
        if (payload.status === "completed") return 0;
        if (payload.status === "paused") {
          return Math.max(0, Math.floor(Number(payload.pausedRemainingSeconds || 0)));
        }
        if (payload.mode === "time" && payload.endsAt) {
          return Math.max(0, Math.floor((new Date(payload.endsAt).getTime() - Date.now()) / 1000));
        }
        if (payload.status === "running" && payload.startedAt) {
          const startedAt = new Date(payload.startedAt).getTime();
          const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
          return Math.max(0, Math.floor(Number(payload.durationSeconds || 0)) - elapsedSeconds);
        }
        if (payload.pausedRemainingSeconds != null) {
          return Math.max(0, Math.floor(Number(payload.pausedRemainingSeconds)));
        }
        return Math.max(0, Math.floor(Number(payload.durationSeconds || 0)));
      }

      function formatClock(seconds, payload) {
        const safeSeconds = Math.max(0, Math.floor(seconds));
        const hours = Math.floor(safeSeconds / 3600);
        const minutes = Math.floor((safeSeconds % 3600) / 60);
        const secs = safeSeconds % 60;
        const showHours = Boolean(payload.showHours || hours > 0);
        const showMinutes = payload.showMinutes !== false || showHours;
        const showSeconds = payload.showSeconds !== false || !showMinutes;
        const parts = [];

        if (showHours) {
          parts.push(String(hours).padStart(2, "0"));
        }
        if (showMinutes) {
          parts.push(String(minutes).padStart(2, "0"));
        }
        if (showSeconds) {
          parts.push(String(secs).padStart(2, "0"));
        }
        return parts.join(":");
      }

      function renderCountdownLayer(item) {
        const payload = item.countdown || {};
        const style = getStyle(item);
        const zoom = getPresentationZoom(item) * getOutputViewportScale();
        const bgImage = getContentUrl(style.backgroundImage);
        const bgVideo = getContentUrl(style.backgroundVideo);
        const bgPattern = getContentUrl(style.backgroundPattern);
        const textColor = style.textColor || "#ffffff";
        const backgroundOpacity = Math.max(0, Math.min(1, Number(style.backgroundOpacity == null ? 1 : style.backgroundOpacity)));
        const overlayOpacity = Math.max(0, Math.min(1, Number(style.overlayOpacity || 0)));
        const overlayColor = style.overlayColor || "#000000";
        const title = payload.showTitle === false ? "" : (payload.title || item.title || "Countdown");
        const message = payload.completionMessage || item.subtitle || "";

        return `
          <div class="stage-bg" style="background:${escapeHtml(getStageBackground(style))};">
            ${bgPattern ? `<img class="stage-pattern" src="${escapeHtml(bgPattern)}" alt="" style="object-fit:cover;opacity:${backgroundOpacity};" />` : ""}
            ${bgImage ? `<img src="${escapeHtml(bgImage)}" alt="" style="object-fit:cover;opacity:${backgroundOpacity};" />` : ""}
            ${bgVideo ? `<video src="${escapeHtml(bgVideo)}" muted loop playsinline preload="auto" onloadeddata="try{this.play().catch(function(){})}catch(e){}" style="object-fit:cover;opacity:${backgroundOpacity};"></video>` : ""}
          </div>
          <div class="stage-overlay" style="background:${escapeHtml(overlayColor)};opacity:${overlayOpacity};"></div>
          <div class="stage-content">
            <div class="countdown-shell" style="
              color:${escapeHtml(textColor)};
              font-family:${escapeHtml(style.fontFamily || '"Inter", "Segoe UI", sans-serif')};
              text-shadow:${escapeHtml(style.textShadow || "0 12px 40px rgba(0,0,0,0.45)")};
              ${style.textOutline ? `paint-order:stroke fill;-webkit-text-stroke:${Math.max(1, Number(style.textOutlineWidth || 2))}px ${escapeHtml(style.textOutlineColor || "#000000")};` : ""}
            ">
              ${title ? `<div class="stage-title" style="font-size:${zoomClamp(46, 4, 90, zoom)};">${escapeHtml(title)}</div>` : ""}
              <div id="countdownClock" class="countdown-clock" style="font-size:${zoomClamp(100, 11, 240, zoom)};"></div>
              ${message ? `<div class="countdown-message" style="font-size:${zoomClamp(20, 1.8, 34, zoom)};">${escapeHtml(message)}</div>` : ""}
            </div>
          </div>
        `;
      }

      function renderTickerLayer(item) {
        const ticker = item.ticker || {};
        if (!ticker.text || ticker.hidden) return "";
        const direction = ticker.direction || "rtl";
        const durationSeconds = Math.max(6, 42 / Math.max(0.25, Number(ticker.speed || 1)));
        const pausedClass = ticker.paused ? "ticker-paused" : "";
        const directionClass = direction === "ltr"
          ? "ticker-ltr"
          : direction === "static"
            ? "ticker-static"
            : "ticker-rtl";
        const positionClass = ticker.position === "top" ? "ticker-top" : "ticker-bottom";

        return `
          <div class="ticker-layer ${positionClass}">
            <div class="ticker-bar" style="
              background:${escapeHtml(ticker.backgroundColor || "#000000")};
              color:${escapeHtml(ticker.textColor || "#ffffff")};
              font-size:${Math.max(16, Number(ticker.fontSize || 32))}px;
              font-family:${escapeHtml(ticker.fontFamily || '"CMG Sans Black", "CMG Sans", "Noto Sans", "Charis SIL", "Inter", "Segoe UI", sans-serif')};
              font-weight:700;
            ">
              <div class="ticker-track ${directionClass} ${pausedClass}" style="animation-duration:${durationSeconds}s;">
                ${escapeHtml(ticker.text)}
              </div>
            </div>
          </div>
        `;
      }

      function renderItem(item, isLowerThird = false) {
        clearCountdownTimer();
        waitingState.classList.add("hidden");
        invalidState.classList.add("hidden");

        if (!item) {
          showBlank();
          return;
        }

        const isCountdown = Boolean(item.countdown);
        const isMedia = Boolean(item.media) || Boolean(item.imageUrl) || Boolean(item.videoUrl);

        if (isMedia) {
          stage.classList.add("remote-stage--media");
        } else {
          stage.classList.remove("remote-stage--media");
        }

        const tickerMarkup = item.ticker ? renderTickerLayer(item) : "";
        const stageMarkup = isCountdown
          ? renderCountdownLayer(item)
            : isMedia
              ? renderMediaLayer(item)
              : renderTextLayer(item, isLowerThird);

        if (body) {
          body.style.background = isMedia || isLowerThird ? "transparent" : getStageBackground(getStyle(item));
        }
        stage.style.background = isMedia || isLowerThird ? "transparent" : getStageBackground(getStyle(item));
        stage.innerHTML = `${stageMarkup}${tickerMarkup}`;

        if (isCountdown) {
          const payload = item.countdown || {};
          const clock = document.getElementById("countdownClock");
          const updateClock = function () {
            if (!clock) return;
            const remaining = calculateRemainingSeconds(payload);
            clock.textContent = formatClock(remaining, payload);
          };
          updateClock();
          countdownTimer = window.setInterval(updateClock, 250);
          return;
        }

        const video = document.getElementById("stageVideo");
        if (video && item.media && item.media.playback) {
          const applyPlayback = function () {
            syncVideoPlayback(video, item.media.playback);
          };
          video.addEventListener("loadedmetadata", applyPlayback, { once: true });
          applyPlayback();
        }
      }

      // ── Broadcast graphic layer ──────────────────────────────────────────
      // state.graphic = { url, version } — a lower-third-overlay.html URL
      // (the design travels in its #data= hash). A new hash on the same page
      // is a fragment navigation, so the page animates out/in without reloading.
      var graphicFrame = document.getElementById("graphicLayer");
      var lastGraphicKey = "";
      var lastMainKey = null;

      function resolveGraphicUrl(url) {
        try {
          var parsed = new URL(String(url || ""), window.location.href);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
          var localHosts = ["127.0.0.1", "localhost"];
          // Opened from another computer on the network: the overlay server is
          // on the same machine as this viewer server.
          if (
            localHosts.indexOf(parsed.hostname) >= 0 &&
            window.location.hostname &&
            localHosts.indexOf(window.location.hostname) < 0
          ) {
            parsed.hostname = window.location.hostname;
          }
          return parsed.toString();
        } catch (error) {
          return "";
        }
      }

      function hasGraphic(state) {
        return Boolean(state && state.graphic && state.graphic.url);
      }

      function applyGraphicLayer(graphic) {
        if (!graphicFrame) return;
        var key = graphic && graphic.url ? String(graphic.version || "") + "|" + graphic.url : "";
        if (key === lastGraphicKey) return;
        lastGraphicKey = key;
        if (!key) {
          graphicFrame.classList.add("hidden");
          graphicFrame.removeAttribute("src");
          return;
        }
        var url = resolveGraphicUrl(graphic.url);
        if (!url) return;
        graphicFrame.classList.remove("hidden");
        if (graphicFrame.getAttribute("src") !== url) {
          graphicFrame.setAttribute("src", url);
        }
      }

      function hasVisibleContent(state) {
        return Boolean(state && (state.fullscreen || state.lowerThird || hasGraphic(state)));
      }

      var pendingClearTimer = null;
      var pendingClearState = undefined;

      function applyRemoteState(nextState) {
        if (pendingClearTimer !== null) {
          // The poll repeats the snapshot we are already waiting to clear to.
          if (
            nextState &&
            pendingClearState &&
            Number(nextState.updatedAt) === Number(pendingClearState.updatedAt)
          ) {
            return;
          }
          window.clearTimeout(pendingClearTimer);
          pendingClearTimer = null;
          pendingClearState = undefined;
        }
        if (outDelayMs > 0 && nextState && hasVisibleContent(lastResolvedState) && !hasVisibleContent(nextState)) {
          pendingClearState = nextState;
          pendingClearTimer = window.setTimeout(function () {
            pendingClearTimer = null;
            pendingClearState = undefined;
            renderRemoteState(nextState);
          }, outDelayMs);
          return;
        }
        renderRemoteState(nextState);
      }

      function renderRemoteState(nextState) {
        // A healthy WebSocket delivers updates immediately. The no-store poll
        // below is a recovery path for browser sources that keep a half-open
        // socket after a network interruption, so ignore snapshots we've
        // already rendered rather than restarting video/countdown content.
        if (
          nextState &&
          lastResolvedState &&
          Number(nextState.updatedAt) === Number(lastResolvedState.updatedAt)
        ) {
          return;
        }
        lastResolvedState = nextState;
        if (nextState === undefined || nextState === null) {
          applyGraphicLayer(null);
          lastMainKey = null;
          showWaiting();
          return;
        }

        applyGraphicLayer(nextState.graphic || null);

        // A graphic-only update leaves the main content as it is (no video restart).
        const mainKey = JSON.stringify([nextState.fullscreen || null, nextState.lowerThird || null]);
        if (mainKey === lastMainKey) {
          if (!nextState.fullscreen && !nextState.lowerThird) showBlankForGraphic(hasGraphic(nextState));
          return;
        }
        lastMainKey = mainKey;

        const isLowerThird = Boolean(nextState && !nextState.fullscreen && nextState.lowerThird);
        const item = nextState.fullscreen || nextState.lowerThird || null;
        if (!item) {
          showBlankForGraphic(hasGraphic(nextState));
          return;
        }
        renderItem(item, isLowerThird);
      }

      // Nothing on screen but a graphic: keep the page see-through so the
      // graphic sits over the camera like a normal lower third.
      function showBlankForGraphic(graphicVisible) {
        showBlank();
        if (graphicVisible && body) {
          body.style.background = "transparent";
        }
      }

      async function fetchMeta() {
        const response = await fetch(`/api/presentation-meta?sessionId=${encodeURIComponent(sessionId)}`, {
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error("meta");
        }
        return response.json();
      }

      async function fetchState() {
        if (!sessionId) return;
        try {
          const response = await fetch(`/api/presentation-state?sessionId=${encodeURIComponent(sessionId)}`, {
            cache: "no-store",
          });
          if (!response.ok) return;
          const payload = await response.json();
          if (payload && Object.prototype.hasOwnProperty.call(payload, "state")) {
            applyRemoteState(payload.state || null);
            return;
          }
          applyRemoteState(payload || null);
        } catch {
          // Ignore fetch errors. Polling will retry.
        }
      }

      async function sendHeartbeat() {
        if (!sessionId || !viewerId) return;
        try {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
              type: "viewer_heartbeat",
              sessionId,
              viewerId,
            }));
            return;
          }
          await fetch("/api/presentation-viewer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, viewerId }),
          });
        } catch {
          // Ignore heartbeat failures.
        }
      }

      function stopHeartbeat() {
        if (heartbeatTimer !== null) {
          window.clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
      }

      function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = window.setInterval(sendHeartbeat, 10000);
      }

      function stopPolling() {
        if (pollTimer !== null) {
          window.clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function startPolling() {
        if (pollTimer !== null) return;
        pollTimer = window.setInterval(function () {
          if (document.visibilityState === "hidden") return;
          void fetchState();
        }, 3000);
      }

      function clearReconnectTimer() {
        if (reconnectTimer !== null) {
          window.clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      }

      function scheduleReconnect() {
        if (!sessionId || wsPort <= 0) {
          startPolling();
          return;
        }

        clearReconnectTimer();
        const delay = reconnectDelays[Math.min(reconnectAttempt, reconnectDelays.length - 1)];
        reconnectTimer = window.setTimeout(function () {
          reconnectTimer = null;
          reconnectAttempt += 1;
          connectSocket();
        }, delay);
      }

      function connectSocket() {
        if (!sessionId || wsPort <= 0) {
          startPolling();
          return;
        }

        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          return;
        }

        try {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          const host = window.location.hostname || "127.0.0.1";
          socket = new WebSocket(`${protocol}//${host}:${wsPort}`);
        } catch {
          socket = null;
          scheduleReconnect();
          return;
        }

        socket.addEventListener("open", function () {
          reconnectAttempt = 0;
          // Keep polling as a recovery path in case the socket becomes
          // half-open and never emits a close event.
          socket.send(JSON.stringify({
            type: "viewer_hello",
            sessionId,
            viewerId,
          }));
          void sendHeartbeat();
        });

        socket.addEventListener("message", function (event) {
          try {
            const payload = JSON.parse(event.data);
            if (payload && payload.type === "presentation_state" && payload.sessionId === sessionId) {
              applyRemoteState(payload.state || null);
            }
          } catch {
            // Ignore malformed socket messages.
          }
        });

        socket.addEventListener("close", function () {
          socket = null;
          scheduleReconnect();
        });

        socket.addEventListener("error", function () {
          if (socket) {
            socket.close();
          }
        });
      }

      async function bootstrap() {
        sessionId = getSessionId();
        if (!sessionId) {
          showInvalid();
          return;
        }

        viewerId = getViewerId();
        showWaiting();

        if (typeof BroadcastChannel !== "undefined") {
          try {
            const channel = new BroadcastChannel("mce-presentation:" + sessionId);
            channel.onmessage = function (event) {
              if (event.data) applyRemoteState(event.data);
            };
          } catch (err) {}
        }
        window.addEventListener("storage", function (event) {
          if (event.key === "mce-presentation-state:" + sessionId && event.newValue) {
            try {
              applyRemoteState(JSON.parse(event.newValue));
            } catch (err) {}
          }
        });

        try {
          const params = new URLSearchParams(window.location.search);
          wsPort = Number(params.get("wsPort") || "0");
          if (wsPort <= 0) {
            const meta = await fetchMeta();
            wsPort = Number(meta && meta.wsPort ? meta.wsPort : 0);
          }
        } catch {
          wsPort = 0;
        }

        await fetchState();
        connectSocket();
        startHeartbeat();
        startPolling();
        void sendHeartbeat();
      }

      document.addEventListener("keydown", handleZoomKeydown);
      document.addEventListener("wheel", handleZoomWheel, { passive: false });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          void fetchState();
          void sendHeartbeat();
        }
      });

      window.addEventListener("beforeunload", function () {
        stopHeartbeat();
        stopPolling();
        clearReconnectTimer();
        clearCountdownTimer();
        try {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
          }
        } catch {
          // Ignore close failures.
        }
      });

      bootstrap().catch(function () {
        showInvalid();
      });
    })();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeChurchEazy Output</title>
  <!--
    Presentation Studio output: what the projector shows.

    The three MCE overlay pages (Bible, Worship, Notes) are stacked full size, so
    every theme looks the same as in OBS, plus a media layer (pictures, videos).

    The app keeps one program state on its local server (/api/studio-state):
      { revision, active, screen, logoUrl?, churchName?, packets: {bible, worship, notes}, media, mix? }
    `mix` is the Screen Mix: video / picture / camera layers behind the words, banners and the logo on top.
    `camera` is the Studio camera: { enabled, deviceId, layout } with layout camera-only | behind-content |
    in-front | hidden. Hidden keeps the camera open (instant to show again); only enabled:false closes it.
    `mediaControl` / `audioControl` play, pause, seek, loop and set the volume of the video / sound.
    This page reads it (immediately when the relay pings, otherwise every 400 ms)
    and gives each overlay page its packet through the URL hash, the same way the
    Studio's Preview works. The overlay pages ignore the relay (mceRelay=0), so the
    Dock / OBS can never paint over the projector by accident.

    ?feed=alt is the alternate output: everything Program shows, but the words come from
    `alt.packets` (the same item in its own look, e.g. Lower Third while the room sees Full Screen).
    It never plays sound, so the sound is not heard twice.

    The in-app Program monitor loads this same page with ?monitor=1. Other screens on
    the same Wi-Fi can open it too (the Studio's "Share over Wi-Fi" link).
  -->
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body:not(.monitor) { cursor: none; }
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      pointer-events: none;
    }
    #layer-media {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #layer-media.is-on { opacity: 1; }
    #layer-media img,
    #layer-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Stacking: Screen Mix backdrops < camera behind < words / media < banners, logo < camera in front < curtain. */
    #mix-back, #mix-front { position: absolute; inset: 0; pointer-events: none; }
    #mix-back { z-index: 1; }
    .layer { z-index: 3; transition: opacity 0.35s ease; }
    #mix-front { z-index: 5; }
    /* Camera only is a full-screen camera layer over the active scene. Keep the scene underneath
       so it remains visible if the camera cannot open or stops sending pictures. */
    body.content-off .layer { opacity: 0 !important; }
    #cam {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      overflow: hidden;
      background: #000;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #cam video, #cam img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #cam img, #cam #cam-rtc { display: none; position: absolute; inset: 0; }
    #cam.has-frame img { display: block; }
    #cam.has-frame video { display: none; }
    #cam.has-live #cam-rtc { display: block !important; }
    #cam.has-live img, #cam.has-live video:not(#cam-rtc) { display: none !important; }
    #cam.is-on { opacity: 1; }
    /* Preview only: if the camera can't open inside the preview, still show where it will sit. */
    body.feed-preview #cam.no-video { background: linear-gradient(135deg, #1b2438, #0b1020); }
    body.feed-preview #cam.no-video::after {
      content: 'CAMERA';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.55);
      font: 700 3vw/1 sans-serif; letter-spacing: 0.3em;
    }
    body.feed-preview #cam.l-in-front.no-video::after { font-size: 1.6vw; }
    #cam.l-camera-only { z-index: 6; }
    /* In front: a picture-in-picture box over the words. */
    #cam.l-in-front {
      z-index: 6;
      inset: auto 3vw auto auto;
      top: 4vh;
      width: 30vw;
      height: 16.875vw;
      border-radius: 1vw;
      box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.55);
      border: 0.25vw solid rgba(255, 255, 255, 0.85);
    }
    .mix-item { position: absolute; inset: 0; opacity: 0; transition: opacity 0.45s ease; }
    .mix-item.is-on { opacity: 1; }
    .mix-item video, .mix-item img.mix-fill { width: 100%; height: 100%; display: block; background: #000; }
    .mix-banner {
      position: absolute;
      inset: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5vh;
      max-width: 62vw;
      padding: 1.6vh 2.4vw 1.8vh;
      border-left: 0.6vw solid #e11d48;
      border-radius: 0.6vw;
      background: linear-gradient(90deg, rgba(8, 10, 20, 0.92), rgba(8, 10, 20, 0.78));
      color: #fff;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      opacity: 0;
      transform: translateY(3vh);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .mix-banner.is-on { opacity: 1; transform: none; }
    .mix-banner .t { font-weight: 800; font-size: 3.2vw; line-height: 1.15; }
    .mix-banner .s { font-weight: 500; font-size: 1.8vw; line-height: 1.25; opacity: 0.85; }
    .mix-banner.c-bottom-left { left: 3vw; bottom: 6vh; }
    .mix-banner.c-bottom-center { left: 50%; bottom: 6vh; margin-left: -31vw; width: 62vw; align-items: center; text-align: center; border-left: 0; border-bottom: 0.5vh solid #e11d48; }
    .mix-banner.c-bottom-right { right: 3vw; bottom: 6vh; }
    .mix-banner.c-top-left { left: 3vw; top: 5vh; }
    .mix-banner.c-top-right { right: 3vw; top: 5vh; }
    .mix-graphic { position: absolute; inset: 0; pointer-events: none; }
    .mix-graphic__frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
    /* An overlay page of the app's own (ticker, countdown, clock): drawn at 1920 wide and scaled to the screen. */
    .mix-page { position: absolute; left: 0; right: 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; }
    .mix-page.is-on { opacity: 1; }
    .mix-page.box-full { top: 0; bottom: 0; }
    .mix-page.box-top { top: 0; }
    .mix-page.box-bottom { bottom: 0; }
    .mix-page__frame { position: absolute; left: 0; top: 0; border: 0; background: transparent; color-scheme: normal; transform-origin: 0 0; }
    .mix-logo { position: absolute; max-width: 14vw; max-height: 16vh; object-fit: contain; opacity: 0; transition: opacity 0.45s ease; }
    .mix-logo.is-on { opacity: 1; }
    .mix-logo.c-bottom-left { left: 3vw; bottom: 4vh; }
    .mix-logo.c-bottom-center { left: 50%; bottom: 4vh; transform: translateX(-50%); }
    .mix-logo.c-bottom-right { right: 3vw; bottom: 4vh; }
    .mix-logo.c-top-left { left: 3vw; top: 4vh; }
    .mix-logo.c-top-right { right: 3vw; top: 4vh; }
    #curtain {
      position: absolute;
      inset: 0;
      z-index: 10 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }
    #curtain.is-on {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease;
    }
    /* The logo (or the church name) sits exactly in the middle, across and down. */
    #curtain img, #idle img {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: block; margin: 0;
      width: calc(42vw * var(--logo-scale, 1));
      height: calc(42vh * var(--logo-scale, 1));
      max-width: 96vw;
      max-height: 96vh;
      object-fit: contain;
    }
    #curtain.has-bg-image { background-size: cover; background-position: center; background-repeat: no-repeat; }
    #curtain .name, #idle .name {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 88vw;
      color: #fff;
      font: 600 4.2vw/1.2 Inter, "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    /* The picture shown when the logo screen has no church logo, and behind everything while nothing is on. */
    #idle {
      position: absolute; inset: 0; z-index: 0;
      background: #0a3be8 center / cover no-repeat url('/make_church_easy_onboarding.png');
      opacity: 0; visibility: hidden;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
    }
    #idle.is-on { opacity: 1; visibility: visible; transition: opacity 0.45s ease; }
    #curtain.is-default { background: #0a3be8 center / cover no-repeat url('/make_church_easy_onboarding.png'); }
    #diag {
      display: none; position: fixed; left: 12px; bottom: 12px; z-index: 60; margin: 0;
      max-width: 70vw; padding: 10px 12px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.78); color: #d7e3ff; font: 12px/1.5 ui-monospace, Menlo, monospace;
      white-space: pre-wrap; pointer-events: none;
    }
    body.show-diag #diag { display: block; }
    #hint, #menu {
      position: absolute;
      z-index: 20;
      font: 500 14px/1.3 Inter, "Segoe UI", system-ui, sans-serif;
      color: #fff;
    }
    #hint {
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #hint.is-on { opacity: 1; }
    #hint kbd {
      padding: 1px 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      font: inherit;
    }
    #menu {
      display: none;
      min-width: 200px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: #1f2024;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    #menu.is-on { display: block; }
    #menu button {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    #menu button:hover { background: #3a5bd9; }
    #menu button span { opacity: 0.6; }
    body:not(.monitor).show-cursor { cursor: default; }
  </style>
<style id="mce-no-video-ui">
/* Never show the browser's own play button or video controls (the overlay plays its videos itself). */
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-play-button { display: none !important; opacity: 0 !important; visibility: hidden !important; -webkit-appearance: none !important; pointer-events: none !important; }
video { outline: none; }
</style>
</head>
<body>
  <div id="mix-back" aria-hidden="true"></div>
  <div id="cam" aria-hidden="true"><video muted playsinline></video><video id="cam-rtc" muted playsinline></video><img id="cam-img" alt=""></div>
  <audio id="audio" preload="auto"></audio>
  <iframe class="layer" id="layer-bible" title="Bible" data-src="mce-bible-overlay.html?tab=bible&amp;mceRelay=0&amp;mceSource=studio-output-bible"></iframe>
  <iframe class="layer" id="layer-worship" title="Worship" data-src="mce-worship-overlay.html?mceRelay=0&amp;mceSource=studio-output-worship"></iframe>
  <iframe class="layer" id="layer-notes" title="Notes" data-src="mce-note.html?mceRelay=0&amp;mceSource=studio-output-notes"></iframe>
  <div class="layer" id="layer-media"></div>
  <div id="mix-front" aria-hidden="true"></div>
  <div id="idle" aria-hidden="true"></div>
  <div id="curtain" aria-hidden="true"></div>
  <div id="hint" role="status"></div>
  <pre id="diag" aria-hidden="true"></pre>
  <div id="menu" role="menu"><button type="button" id="menu-close" role="menuitem">Close projector <span>Esc</span></button></div>
  <script src="/studio-graphic-placement.js"></script>
    <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var isMonitor = params.get('monitor') === '1';
      if (isMonitor) document.body.classList.add('monitor');
      if (params.get('feed') === 'preview') document.body.classList.add('feed-preview');
      // The Studio's own monitors (Preview, Live card) get the camera picture from the Studio itself,
      // drawn behind / over this page, so the camera is never opened twice. Transparent here.
      var NOCAM = params.get('nocam') === '1';
      if (NOCAM) {
        document.body.classList.add('nocam');
        document.documentElement.style.background = 'transparent';
        document.body.style.background = 'transparent';
      }
      // program (default), alt or preview: which part of the Studio state this screen shows.
      var feed = params.get('feed') === 'preview' ? 'preview' : params.get('feed') === 'alt' ? 'alt' : 'program';
      // Only one screen plays the sound: the in-app monitors and the alternate output stay silent.
      var SILENT = isMonitor || feed === 'alt';
      // Window label when opened as a projector by the app (Esc asks the app to close it).
      var winLabel = params.get('win') || '';
      var relaySocket = null;

      var EXIT_MS = 700;
      var layers = {
        bible: document.getElementById('layer-bible'),
        worship: document.getElementById('layer-worship'),
        notes: document.getElementById('layer-notes'),
        media: document.getElementById('layer-media')
      };
      var curtain = document.getElementById('curtain');
      var idleEl = document.getElementById('idle');
      var baseSrc = {};
      ['bible', 'worship', 'notes'].forEach(function (key) {
        baseSrc[key] = layers[key].getAttribute('data-src');
      });
      var LITE = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent || '') && !winLabel;
      function ensureLoaded(key) { if (!layers[key].getAttribute('src') && baseSrc[key]) layers[key].setAttribute('src', baseSrc[key]); }
      if (!LITE) ['bible', 'worship', 'notes'].forEach(ensureLoaded);
      var loaded = { bible: false, worship: false, notes: false };
      var queued = {};
      var appliedPacket = {};
      var hideTimers = {};
      var lastRevision = 0;
      var PAGE_REV = 12;
      var lastScreenKey = '';
      var lastMediaKey = '';

      ['bible', 'worship', 'notes'].forEach(function (key) {
        layers[key].addEventListener('load', function () {
          loaded[key] = true;
          if (queued[key]) {
            var p = queued[key];
            queued[key] = null;
            sendPacket(key, p);
          }
        });
      });

      // A new hash on the same page is a fragment navigation: the overlay page's
      // hashchange handler renders it without reloading.
      function sendPacket(key, packet) {
        if (!loaded[key]) { queued[key] = packet; ensureLoaded(key); return; }
        var json = JSON.stringify(packet);
        if (appliedPacket[key] === json) return;
        appliedPacket[key] = json;
        try {
          layers[key].contentWindow.location.hash = 'data=' + encodeURIComponent(json);
        } catch (e) {
          layers[key].src = baseSrc[key] + '#data=' + encodeURIComponent(json);
        }
      }

      function applyActive(active) {
        Object.keys(layers).forEach(function (key) {
          var el = layers[key];
          clearTimeout(hideTimers[key]);
          if (key === active) {
            el.style.visibility = 'visible';
          } else if (el.style.visibility !== 'hidden') {
            hideTimers[key] = setTimeout(function () { el.style.visibility = 'hidden'; }, EXIT_MS);
          }
        });
      }

      var mediaNode = null;
      var lastVideoSeek = 0;

      // Start muted so WebKit can autoplay even when the Studio click happened in another window.
      // Restore the requested sound only after playback has actually started.
      function applyRequestedVideoMute(node) {
        var muted = SILENT || node.dataset.requestedMuted === '1';
        node.defaultMuted = muted;
        node.muted = muted;
      }

      function playVideo(node, mutedByChoice) {
        var desiredMuted = SILENT || mutedByChoice === true;
        node.dataset.requestedMuted = desiredMuted ? '1' : '0';
        node.dataset.autoplayMutePending = desiredMuted ? '0' : '1';
        node.defaultMuted = true;
        node.muted = true;
        var attempt;
        try { attempt = node.play(); } catch (e) { attempt = Promise.reject(e); }
        if (attempt && attempt.then) attempt.then(function () {
          if (node.dataset.paused) return;
          delete node.dataset.autoplayMutePending;
          if (node.dataset.soundBlocked === '1') { node.defaultMuted = true; node.muted = true; return; }
          applyRequestedVideoMute(node);
        }).catch(function () { /* the file may not be playable */ });
      }

      // Safety net: the browser sometimes pauses a video (blocked sound, stalled load, tab hidden).
      // If nobody asked for a pause, start it again - muted if the sound was the reason.
      function keepVideoMoving(node) {
        if (!node || node.tagName !== 'VIDEO' || node.dataset.paused || node.ended) return;
        if (node.paused) {
          if (node.dataset.requestedMuted === '0' && node.dataset.autoplayMutePending !== '1' && node.muted === false && node.currentTime > 0) {
            node.dataset.soundBlocked = '1';
          }
          playVideo(node, node.dataset.soundBlocked === '1' ? true : node.dataset.requestedMuted === '1');
        }
      }
      setInterval(function () { keepVideoMoving(mediaNode); }, 700);

      // Diagnostic: if the screen video has not moved for 3 seconds, say why in a small badge (monitor only).
      var diagBadge = null, diagLast = -1, diagSince = Date.now();
      function videoPlaybackHint(node) {
        if (node.error) {
          if (node.error.code === 3) return 'Video could not be decoded. Export as MP4 (H.264 video, AAC audio).';
          if (node.error.code === 4) return 'This video format or codec is unsupported. Export as MP4 (H.264 video, AAC audio).';
          if (node.error.code === 2) return 'Video could not be loaded. Check that the file is still available, then send it again.';
          if (node.error.code === 1) return 'Video loading was interrupted. Send it to the screen again.';
        }
        if (node.readyState === 0) return 'Video has not loaded. Check the file, then try sending it again.';
        if (node.paused) return 'Video is paused or playback was blocked. Send it to the screen again.';
        return 'Video is waiting for data. Check the file and try an MP4 export (H.264/AAC).';
      }
      setInterval(function () {
        var n = mediaNode;
        if (!isMonitor || !n || n.tagName !== 'VIDEO') { if (diagBadge) diagBadge.style.display = 'none'; return; }
        var t = n.currentTime;
        if (t !== diagLast || n.dataset.paused) { diagLast = t; diagSince = Date.now(); if (diagBadge) diagBadge.style.display = 'none'; return; }
        if (Date.now() - diagSince < 3000) return;
        if (!diagBadge) {
          diagBadge = document.createElement('div');
          diagBadge.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:99999;font:11px/1.35 system-ui,sans-serif;color:#fff;background:rgba(130,20,20,.94);padding:6px 8px;border-radius:3px;pointer-events:none';
          document.body.appendChild(diagBadge);
        }
        var err = n.error ? ' · error ' + n.error.code : '';
        diagBadge.textContent = videoPlaybackHint(n) + err;
        diagBadge.style.display = 'block';
      }, 1000);

      function applyMedia(media) {
        var el = layers.media;
        // Only a new file rebuilds the element; fit, loop, sound and seeking come from mediaControl.
        var key = media ? [media.kind, media.url].join('|') : '';
        if (key === lastMediaKey) return;
        lastMediaKey = key;
        if (!media || !media.url) {
          el.classList.remove('is-on');
          var old = mediaNode;
          mediaNode = null;
          if (old && old.tagName === 'VIDEO') { try { old.pause(); } catch (e) { /* ignore */ } }
          setTimeout(function () { if (!lastMediaKey) el.textContent = ''; }, 400);
          return;
        }
        el.textContent = '';
        var node;
        if (media.kind === 'video') {
          node = document.createElement('video');
          // Do not set the autoplay attribute: WebKit can show a large play overlay when it blocks autoplay.
          // Start playback explicitly below while muted, which works in both WKWebView and WebView2.
          node.autoplay = false;
          node.removeAttribute('autoplay');
          node.controls = false;
          node.loop = media.loop !== false;
          // Set the muted attribute before loading: WebKit checks it when deciding whether to autoplay.
          node.defaultMuted = true;
          node.muted = true;
          node.setAttribute('muted', '');
          node.dataset.requestedMuted = (SILENT || media.muted === true) ? '1' : '0';
          node.dataset.autoplayMutePending = (SILENT || media.muted === true) ? '0' : '1';
          node.playsInline = true;
          // Load the whole file now: with no autoplay attribute a video that only loads its header never says "canplay".
          node.preload = 'auto';
          node.src = media.url;
          node.addEventListener('canplay', function () {
            if (!node.dataset.paused) playVideo(node, media.muted);
          }, { once: true });
          ['loadeddata', 'canplaythrough', 'stalled', 'waiting', 'pause', 'suspend', 'error'].forEach(function (ev) {
            node.addEventListener(ev, function () { setTimeout(function () { keepVideoMoving(node); }, ev === 'pause' ? 60 : 0); });
          });
        } else {
          node = document.createElement('img');
          node.alt = '';
          node.src = media.url;
        }
        node.style.objectFit = media.fit === 'cover' ? 'cover' : 'contain';
        mediaNode = node;
        el.appendChild(node);
        // Start it straight away (muted first, then the requested sound), and again when it can play.
        if (node.tagName === 'VIDEO' && !node.dataset.paused) playVideo(node, media.muted);
        requestAnimationFrame(function () { el.classList.add('is-on'); });
      }

      // Pause / play / seek / volume / loop / fit for a video or audio element.
      function controlPlayer(node, ctrl, lastSeekRef) {
        if (!node || !ctrl) return lastSeekRef;
        if (node.tagName === 'IMG') {
          node.style.objectFit = ctrl.fit === 'cover' ? 'cover' : 'contain';
          return lastSeekRef;
        }
        if (node.tagName === 'VIDEO') node.style.objectFit = ctrl.fit === 'cover' ? 'cover' : 'contain';
        node.loop = ctrl.loop !== false;
        node.dataset.requestedMuted = (SILENT || ctrl.muted === true) ? '1' : '0';
        node.muted = node.dataset.autoplayMutePending === '1' || SILENT || ctrl.muted === true;
        if (node.tagName === 'VIDEO' && node.dataset.autoplayMutePending !== '1') applyRequestedVideoMute(node);
        var volume = Number(ctrl.volume);
        if (isFinite(volume)) node.volume = Math.max(0, Math.min(1, volume));
        var rev = Number(ctrl.seekRev) || 0;
        if (rev && rev !== lastSeekRef) {
          lastSeekRef = rev;
          var to = Math.max(0, Number(ctrl.seekTo) || 0);
          var seek = function () { try { node.currentTime = to; } catch (e) { /* ignore */ } };
          if (node.readyState >= 1) seek(); else node.addEventListener('loadedmetadata', seek, { once: true });
        }
        if (ctrl.paused) {
          node.dataset.paused = '1';
          try { node.pause(); } catch (e) { /* ignore */ }
        } else {
          delete node.dataset.paused;
          if (node.paused) playVideo(node, ctrl.muted);
        }
        return lastSeekRef;
      }

      // ── Sound (plays under the screen) ──
      var audioEl = document.getElementById('audio');

      }
      function updatePage(entry, layer) {
        var hash = pageHash(layer.pageUrl);
        if (!entry.frame || !layer.pageUrl || hash === entry.pageHash) return;
        entry.pageHash = hash;
        try { entry.frame.contentWindow.location.hash = hash; } catch (e) { entry.frame.src = layer.pageUrl; }
      }
      window.addEventListener('resize', function () {
        Object.keys(mixEntries).forEach(function (id) { if (mixEntries[id].layer.kind === 'page') sizePage(mixEntries[id]); });
      });

      function buildMixElement(layer) {
        var el, media = null;
        if (layer.kind === 'video') {
          el = document.createElement('div');
          el.className = 'mix-item';
          media = document.createElement('video');
          media.loop = layer.loop !== false;
          media.muted = SILENT || layer.muted === true;
          media.playsInline = true;
          media.src = layer.url || '';
          media.style.objectFit = layer.fit === 'contain' ? 'contain' : 'cover';
          el.appendChild(media);
        } else if (layer.kind === 'image') {
          el = document.createElement('div');
          el.className = 'mix-item';
          media = document.createElement('img');
          media.className = 'mix-fill';
          media.alt = '';
          media.src = layer.url || '';
          media.style.objectFit = layer.fit === 'contain' ? 'contain' : 'cover';
          el.appendChild(media);
        } else if (layer.kind === 'camera') {
          el = document.createElement('div');
          el.className = 'mix-item';
          media = document.createElement('video');
          media.muted = true;
          media.playsInline = true;
          media.style.objectFit = layer.fit === 'contain' ? 'contain' : 'cover';
          el.appendChild(media);
        } else if (layer.kind === 'banner') {
          el = document.createElement('div');
          el.className = 'mix-banner c-' + (layer.corner || 'bottom-left');
          var t = document.createElement('div');
          t.className = 't';
          t.textContent = layer.text || '';
          el.appendChild(t);
          if (layer.subtext) {
            var sub = document.createElement('div');
            sub.className = 's';
            sub.textContent = layer.subtext;
            el.appendChild(sub);
          }
        } else if (layer.kind === 'graphic') {
          // A Broadcast graphic: drawn by the app's own runtime inside a frame; In and Out are its real animations.
          el = document.createElement('div');
          el.className = 'mix-graphic';
        } else if (layer.kind === 'page') {
          el = document.createElement('div');
          el.className = 'mix-page box-' + (layer.pageBox === 'top' || layer.pageBox === 'bottom' ? layer.pageBox : 'full');
          var pf = document.createElement('iframe');
          pf.className = 'mix-page__frame';
          pf.setAttribute('allowtransparency', 'true');
          pf.setAttribute('aria-hidden', 'true');
          pf.setAttribute('tabindex', '-1');
          if (layer.pageHtml) {
            pf.setAttribute('sandbox', 'allow-same-origin allow-scripts');
            pf.srcdoc = layer.pageHtml;
          } else {
            pf.src = layer.pageUrl || 'about:blank';
          }
          el.appendChild(pf);
          return { el: el, media: null, stream: null, frame: pf, pageHash: pageHash(layer.pageUrl) };
        } else if (layer.kind === 'logo') {
          el = document.createElement('img');
          el.className = 'mix-logo c-' + (layer.corner || 'top-right');
          el.alt = '';
          el.src = layer.logoUrl || '';
        } else {
          return null;
        }
        return { el: el, media: media, stream: null };
      }

      function stopCamera(entry) {
        if (entry.stream) {
          entry.stream.getTracks().forEach(function (track) { try { track.stop(); } catch (e) { /* ignore */ } });
          entry.stream = null;
        }
        if (entry.media && entry.layer && entry.layer.kind === 'camera') entry.media.srcObject = null;
      }

      function setMixShown(entry, shown) {
        var layer = entry.layer;
        if (layer.kind === 'graphic') {
          if (shown) {
            if (entry.frame && entry.frame.parentNode) entry.frame.parentNode.removeChild(entry.frame);
            var frame = document.createElement('iframe');
            frame.className = 'mix-graphic__frame';
            frame.setAttribute('sandbox', layer.graphicSandbox || 'allow-same-origin allow-scripts');
            frame.setAttribute('allowtransparency', 'true');
            frame.setAttribute('aria-hidden', 'true');
            frame.srcdoc = layer.graphicHtml || '';
            entry.el.appendChild(frame);
            entry.frame = frame;
            // If the graphic's own scripts did not load here, say so on screen instead of showing nothing.
            frame.addEventListener('load', function () {
              placeGraphic(entry.el, entry.layer, frame);
              setTimeout(function () { placeGraphic(entry.el, entry.layer, frame); }, 700);
              setTimeout(function () {
                var ok = false;
                try { ok = !!(frame.contentWindow && frame.contentWindow.MCEKinetic); } catch (e) { ok = true; }
                var old = document.getElementById('gfx-warn');
                if (old && old.parentNode) old.parentNode.removeChild(old);
                if (ok || entry.frame !== frame) return;
                var w = document.createElement('div');
                w.id = 'gfx-warn';
                w.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99;padding:6px 10px;border-radius:6px;background:rgba(160,20,20,.92);color:#fff;font:12px system-ui,sans-serif;pointer-events:none';
                w.textContent = 'Graphic could not start here: /kinetic scripts did not load (' + location.origin + '). Restart the app.';
                document.body.appendChild(w);
                setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 8000);
              }, 1500);
            });
          } else if (entry.frame) {
            var leaving = entry.frame;
            try { leaving.contentWindow.postMessage({ type: 'mce-kx-out' }, '*'); } catch (e) { /* ignore */ }
            setTimeout(function () {
              if (entry.frame === leaving && !(entry.layer && entry.layer.shown)) {
                if (leaving.parentNode) leaving.parentNode.removeChild(leaving);
                entry.frame = null;
              }
            }, 2200);
          }
          return;
        }
        if (shown) {
          if (layer.kind === 'camera') {
            if (!entry.stream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              var token = entry.token = (entry.token || 0) + 1;
              var video = layer.deviceId ? { deviceId: { exact: layer.deviceId } } : true;
              navigator.mediaDevices.getUserMedia({ video: video, audio: false }).then(function (stream) {
                if (entry.token !== token || !entry.layer.shown) { stream.getTracks().forEach(function (tr) { tr.stop(); }); return; }
                entry.stream = stream;
                entry.media.srcObject = stream;
                try { entry.media.play(); } catch (e) { /* ignore */ }
              }).catch(function () { /* no camera or no permission: the layer stays empty */ });
            }
          } else if (layer.kind === 'video' && entry.media) {
            try { entry.media.play(); } catch (e) { /* ignore */ }
          }
          requestAnimationFrame(function () { entry.el.classList.add('is-on'); });
        } else {
          entry.el.classList.remove('is-on');
          if (layer.kind === 'camera') {
            entry.token = (entry.token || 0) + 1;
            setTimeout(function () { if (!entry.layer.shown) stopCamera(entry); }, 500);
          } else if (layer.kind === 'video' && entry.media) {
            setTimeout(function () { if (!entry.layer.shown) { try { entry.media.pause(); } catch (e) { /* ignore */ } } }, 500);
          }
        }
      }

      // Where a Broadcast graphic sits: it is drawn centred, so it is moved toward an edge and scaled.
      var GFX_POS = {
        'center': [0, 0], 'top-left': [-24, -34], 'top-center': [0, -34], 'top-right': [24, -34],
        'middle-left': [-24, 0], 'middle-right': [24, 0],
        'bottom-left': [-24, 34], 'bottom-center': [0, 34], 'bottom-right': [24, 34]
      };
      function placeGraphic(el, layer, frame) {
        var s = Math.max(30, Math.min(200, Number(layer.graphicScale) || 100)) / 100;
        el.style.transformOrigin = '50% 50%';
        // Measure the graphic and put its edge on a margin, so a wide graphic is never cut off.
        // Until the page has loaded (or if it cannot be measured) the old fixed offsets are used.
        try {
          var placement = window.MCEGraphicPlacement;
          var canvas = frame && frame.contentDocument && frame.contentDocument.getElementById('kx-canvas');
          var node = canvas && canvas.firstElementChild;
          if (placement && node) {
            var box = placement.contentBox(frame.clientWidth, frame.clientHeight, {
              left: node.offsetLeft, top: node.offsetTop, width: node.offsetWidth, height: node.offsetHeight
            });
            if (box) {
              var o = placement.offsets(box, layer.graphicPos, layer.graphicScale);
              el.style.transform = 'translate(' + Math.round(o.dx) + 'px,' + Math.round(o.dy) + 'px) scale(' + o.scale + ')';
              return;
            }
          }
        } catch (e) { /* fall back below */ }
        var p = GFX_POS[layer.graphicPos] || GFX_POS.center;
        el.style.transform = 'translate(' + p[0] + '%,' + p[1] + '%) scale(' + s + ')';
      }
      // The page and its fonts settle after the frame loads, and a resized window changes the scale: place again.
      function replaceGraphics() {
        Object.keys(mixEntries).forEach(function (id) {
          var entry = mixEntries[id];
          if (entry && entry.layer && entry.layer.kind === 'graphic' && entry.frame) placeGraphic(entry.el, entry.layer, entry.frame);
        });
      }
      window.addEventListener('resize', replaceGraphics);

      function applyMix(layers) {
        layers = Array.isArray(layers) ? layers : [];
        var keep = {};
        layers.forEach(function (layer) {
          if (!layer || !layer.id) return;
          keep[layer.id] = true;
          var sig = mixSig(layer);
          var entry = mixEntries[layer.id];
          if (entry && entry.sig !== sig) {
            stopCamera(entry);
            if (entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
            entry = null;
          }
          if (!entry) {
            var built = buildMixElement(layer);
            if (!built) return;
            entry = built;
            entry.sig = sig;
            entry.layer = layer;
            entry.shownNow = false;
            mixEntries[layer.id] = entry;
            var host = (layer.kind === 'banner' || layer.kind === 'logo' || layer.kind === 'graphic' || layer.kind === 'page') ? mixFront : mixBack;
            host.appendChild(entry.el);
            mixOrder = '';
          }
          entry.layer = layer;
          if (layer.kind === 'graphic') placeGraphic(entry.el, layer, entry.frame);
          if (layer.kind === 'page') { sizePage(entry); updatePage(entry, layer); }
          var shown = layer.shown === true;
          if (shown !== entry.shownNow) {
            entry.shownNow = shown;
            setMixShown(entry, shown);
          }
        });
        Object.keys(mixEntries).forEach(function (id) {
          if (keep[id]) return;
          var entry = mixEntries[id];
          delete mixEntries[id];
          entry.layer = { shown: false, kind: entry.layer.kind };
          entry.el.classList.remove('is-on');
          setTimeout(function () {
            stopCamera(entry);
            if (entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
          }, 500);
        });
        // Keep the layers in the order of the list. They are stacked with z-index, never moved:
        // moving a video pauses it and moving a frame reloads its page (a running countdown would restart).
        var order = layers.map(function (l) { return l && l.id; }).join(',');
        if (order !== mixOrder) {
          mixOrder = order;
          layers.forEach(function (layer, index) {
            var entry = layer && mixEntries[layer.id];
            if (entry) entry.el.style.zIndex = String(index + 1);
          });
        }
      }

      function applyState(state) {
        if (!state || typeof state !== 'object' || state.unchanged) return;
        var revision = Number(state.revision) || 0;
        // This window is running an older copy of this page than the Studio expects: load the new one (once).
        if (Number(state.pageRev) > PAGE_REV) {
          try {
            if (sessionStorage.getItem('mce-out-reload') !== String(state.pageRev)) {
              sessionStorage.setItem('mce-out-reload', String(state.pageRev));
              window.location.reload();
              return;
            }
          } catch (e) { /* no storage: do not reload */ }
        }
        if (revision <= lastRevision) return;
        lastRevision = revision;
        var mixLayers = state.mix || [];
        var brandState = state.brand || null;
        var scrollState = Number(state.scrollY) || 0;
        var cameraState = (feed === 'preview' ? (state.previewCamera || state.camera) : state.camera) || null;
        if (feed === 'preview') {
          var pv = state.preview || { active: null, packets: {}, media: null, mediaControl: null };
          state = { active: pv.active, packets: pv.packets || {}, media: pv.media || null, mediaControl: pv.mediaControl || null, screen: 'live' };
        } else if (feed === 'alt' && state.alt && state.alt.packets) {
          state = Object.assign({}, state, {
            active: state.alt.active === undefined ? state.active : state.alt.active,
            packets: state.alt.packets,
          });
        }
        var packets = state.packets || {};
        ['bible', 'worship', 'notes'].forEach(function (key) {
          if (packets[key]) sendPacket(key, packets[key]);
        });
        var mediaCtrl = state.mediaControl || null;
        var audioState = state.audio || null;
        var audioCtrl = state.audioControl || null;
        applyBrand(brandState);
        applyMix(mixLayers);
        lastCam = cameraState;
        cameraWarm = feed !== 'preview' && !!state.cameraWarm;
        applyCamera(cameraState);
        applyAudio(audioState, audioCtrl);
        applyMedia(state.media || null);
        // A tall picture or document page that fills the width can be scrolled up and down.
        if (mediaNode && mediaNode.tagName === 'IMG') mediaNode.style.objectPosition = '50% ' + Math.max(0, Math.min(100, scrollState)) + '%';
        if (mediaNode) lastVideoSeek = controlPlayer(mediaNode, mediaCtrl, lastVideoSeek);
        applyActive(state.active || null);
        applyScreen(state);
        lastScreen = String(state.screen || 'live'); lastActive = state.active ? String(state.active) : '';
        // A projector window (and the Studio's own Output monitor) shows the logo while nothing is on,
        // so an open screen is never just black. A browser source in OBS or a TV link stays as it was.
        if (state.active || state.media) idleSince = 0;
        idleWanted = feed !== 'preview' && (!!winLabel || isMonitor) && lastScreen === 'live' && !state.active && !state.media;
        refreshIdle();
      }

      // The logo covers the screen while nothing is on and no camera picture is showing. If the camera is
      // switched on but its picture has not arrived, the logo stays (never a plain black screen) and a line says so.
      var idleWanted = false;
      var idleSince = 0;
      function refreshIdle() {
        var camWanted = !!(lastCam && lastCam.enabled && lastCam.layout !== 'hidden');
        var camShown = camBox.classList.contains('is-on');
        // Only after nothing has been on for a moment: switching Lower Third / Full Screen briefly
        // clears the screen, and the logo must not flash in between.
        var now = Date.now();
        if (!(idleWanted && !camShown)) idleSince = 0;
        else if (!idleSince) idleSince = now;
        var showIdle = idleSince > 0 && now - idleSince > (camWanted ? 6000 : 3500);
        if (!showIdle) idleEl.style.transition = 'none'; else idleEl.style.transition = '';
        idleEl.classList.toggle('is-on', showIdle);
        if (idleWanted && camWanted && !camShown && winLabel && typeof showHint === 'function') {
          showHint('Waiting for the camera picture from the Studio… (press D to see why)', 900);
        }
      }
      setInterval(refreshIdle, 500);

      var fetching = false;
      function refresh() {
        if (fetching) return;
        fetching = true;
        fetch('/api/studio-state?since=' + lastRevision, { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) { diag.err = 'HTTP ' + r.status; return null; }
            diag.err = ''; diag.okAt = Date.now();
            return r.json();
          })
          .then(applyState)
          .catch(function () { diag.err = 'no answer'; /* the app may be restarting */ })
          .then(function () { fetching = false; });
      }
      refresh();
      setInterval(refresh, 400);

      // Instant updates: the Studio pings the local relay after each change.
      var attempts = 0;
      function connect() {
        var ws;
        try {
          ws = new WebSocket('ws://' + (window.location.hostname || '127.0.0.1') + ':17891');
        } catch (e) { retry(); return; }
        ws.onopen = function () { attempts = 0; relaySocket = ws; };
        ws.onmessage = function (event) {
          try {
            var packet = JSON.parse(event.data);
            if (packet && packet.channel === 'studio') refresh();
          } catch (e) { /* ignore */ }
        };
        ws.onclose = function () { if (relaySocket === ws) relaySocket = null; retry(); };
        ws.onerror = function () { try { ws.close(); } catch (e) { /* ignore */ } };
      }
      function retry() {
        setTimeout(connect, Math.min(10000, 500 * Math.pow(2, attempts++)));
      }
      connect();

      // ── Projector controls: Esc or right-click → Close projector ──
      var hint = document.getElementById('hint');
      var menu = document.getElementById('menu');
      var hintTimer = null;

      function showHint(html, ms) {
        hint.innerHTML = html;
        hint.classList.add('is-on');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hint.classList.remove('is-on'); }, ms || 3000);
      }

      function closeProjector() {
        menu.classList.remove('is-on');
        if (relaySocket && relaySocket.readyState === 1 && winLabel) {
          relaySocket.send(JSON.stringify({ channel: 'studio-control', type: 'close-projector', label: winLabel, senderId: 'studio-output-' + winLabel }));
        } else {
          showHint('Close it from the Studio: right-click Program → Close projectors', 5000);
        }
        try { window.close(); } catch (e) { /* the app closes it */ }
      }

      if (!isMonitor && winLabel) {
        setTimeout(function () { showHint('Press <kbd>Esc</kbd> to close this projector', 3500); }, 600);

        window.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            event.preventDefault();
            if (menu.classList.contains('is-on')) menu.classList.remove('is-on');
            else closeProjector();
          }
        });

        document.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          menu.style.left = Math.min(event.clientX, window.innerWidth - 220) + 'px';
          menu.style.top = Math.min(event.clientY, window.innerHeight - 60) + 'px';
          menu.classList.add('is-on');
        });
        document.addEventListener('mousedown', function (event) {
          if (!menu.contains(event.target)) menu.classList.remove('is-on');
        });
        document.getElementById('menu-close').addEventListener('click', closeProjector);

        // Show the cursor while the mouse moves, hide it again after 2 s.
        var cursorTimer = null;
        document.addEventListener('mousemove', function () {
          document.body.classList.add('show-cursor');
          clearTimeout(cursorTimer);
          cursorTimer = setTimeout(function () { document.body.classList.remove('show-cursor'); }, 2000);
        });
      }
    })();
  </script>
</body>
</html>

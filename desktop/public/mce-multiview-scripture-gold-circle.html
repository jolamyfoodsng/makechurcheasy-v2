<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scripture Gold Circle — Multi-View panel</title>
<meta name="robots" content="noindex">
<link href="/fonts/google/google-fonts.css" rel="stylesheet">
<style>
  /* This page is the OBS Browser source for the Scripture Gold Circle Multi-View look. It is
     created at 1920x1080 (see scriptureGoldCircleLook.ts), so there is no scaling.

     It is opaque everywhere except a transparent circle, same technique as
     mce-multiview-scripture-circle.html — no OBS mask filter needed. The circle's position/size and
     all colors come from the query string, set by scriptureGoldCircleLook.ts. Verse text uses a
     serif Google Font already loaded by google-fonts.css (Playfair Display), per the reference. */
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  .stage { position: relative; width: 1920px; height: 1080px; font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .bg { position: absolute; inset: 0; }
  .paper { position: absolute; inset: 0; }
  .ring-outer { position: absolute; border-radius: 50%; border: 3px solid; }
  .ring-inner { position: absolute; border-radius: 50%; border: 2px solid; }
  .live-row { position: absolute; display: flex; align-items: center; gap: 14px; }
  .live-dot { width: 14px; height: 14px; border-radius: 50%; }
  .live-label { font-size: 24px; font-weight: 700; letter-spacing: .16em; color: #fff; }
  .divider { position: absolute; width: 1px; }
  .right { position: absolute; top: 0; height: 1080px; }
  .eyebrow { position: absolute; left: 0; top: 150px; font-size: 26px; font-weight: 700; letter-spacing: .5em; line-height: 1; }
  .verse { position: absolute; left: 0; top: 220px; width: 100%; line-height: 1.22; font-weight: 700; letter-spacing: -.01em;
    font-family: "Playfair Display", "Georgia", serif; transition: opacity .3s ease; }
  .verse.swap { opacity: 0; }
  .ref { position: absolute; left: 0; top: 900px; display: flex; align-items: center; gap: 24px; font-size: 40px; line-height: 1;
    transition: opacity .3s ease; }
  .ref.swap { opacity: 0; }
  .ref b { font-weight: 800; letter-spacing: .16em; }
  .ref i { display: block; width: 2px; height: 36px; opacity: .6; }
  .ref em { font-style: normal; font-weight: 500; letter-spacing: .16em; color: #fff; font-size: 28px; }
  .verse-em { color: inherit; }

  /* ---- "Animate in" (operator-chosen, see ?anim=) — plays on the verse/reference when they
     swap to new content. .anim-noTransition suspends the plain cross-fade above so the two never
     run at once; see the JS comment near playEntrance() for the sequence. ---- */
  .verse.anim-noTransition, .ref.anim-noTransition { transition: none; }
  .verse.anim-play, .ref.anim-play { animation-duration: .55s; animation-timing-function: cubic-bezier(.22,.9,.3,1); animation-fill-mode: both; }
  .verse.anim-slide-left.anim-play, .ref.anim-slide-left.anim-play { animation-name: mceAnimSlideLeft; }
  .verse.anim-slide-right.anim-play, .ref.anim-slide-right.anim-play { animation-name: mceAnimSlideRight; }
  .verse.anim-slide-up.anim-play, .ref.anim-slide-up.anim-play { animation-name: mceAnimSlideUp; }
  .verse.anim-slide-down.anim-play, .ref.anim-slide-down.anim-play { animation-name: mceAnimSlideDown; }
  .verse.anim-fade-in.anim-play, .ref.anim-fade-in.anim-play { animation-name: mceAnimFadeIn; }
  .verse.anim-fade-up.anim-play, .ref.anim-fade-up.anim-play { animation-name: mceAnimFadeUp; }
  .verse.anim-fade-down.anim-play, .ref.anim-fade-down.anim-play { animation-name: mceAnimFadeDown; }
  .verse.anim-zoom-in.anim-play, .ref.anim-zoom-in.anim-play { animation-name: mceAnimZoomIn; }
  .verse.anim-bounce-in.anim-play, .ref.anim-bounce-in.anim-play { animation-name: mceAnimBounceIn; }
  .verse.anim-flip-in.anim-play, .ref.anim-flip-in.anim-play { animation-name: mceAnimFlipIn; }
  .verse.anim-blur-in.anim-play, .ref.anim-blur-in.anim-play { animation-name: mceAnimBlurIn; }
  @keyframes mceAnimSlideLeft { 0% { transform: translateX(-110%); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateX(0); opacity: 1; } }
  @keyframes mceAnimSlideRight { 0% { transform: translateX(110%); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateX(0); opacity: 1; } }
  @keyframes mceAnimSlideUp { 0% { transform: translateY(60px); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes mceAnimSlideDown { 0% { transform: translateY(-60px); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes mceAnimFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes mceAnimFadeUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes mceAnimFadeDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes mceAnimZoomIn { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes mceAnimBounceIn { 0% { transform: scale(.3); opacity: 0; } 50% { transform: scale(1.08); opacity: 1; } 70% { transform: scale(.95); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes mceAnimFlipIn { 0% { transform: perspective(600px) rotateX(-90deg); opacity: 0; } 60% { transform: perspective(600px) rotateX(10deg); opacity: 1; } 100% { transform: perspective(600px) rotateX(0); opacity: 1; } }
  @keyframes mceAnimBlurIn { 0% { filter: blur(12px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg">
    <div class="paper"></div>
  </div>
  <div class="ring-outer" id="ringOuter"></div>
  <div class="ring-inner" id="ringInner"></div>
  <div class="live-row" id="liveRow">
    <span class="live-dot" id="liveDot"></span>
    <span class="live-label">LIVE</span>
  </div>
  <div class="divider" id="divider"></div>
  <div class="right" id="right">
    <div class="eyebrow" id="eyebrow">SCRIPTURE</div>
    <div class="verse" id="verse"></div>
    <div class="ref" id="ref"><b id="refText"></b><i id="refBar"></i><em id="refVersion"></em></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // ---- settings from the query string (written by scriptureGoldCircleLook.ts) ----
  var params = new URLSearchParams(location.search);
  function hex(v, fallback) { return /^[0-9a-f]{6}$/i.test(v || "") ? "#" + v : fallback; }
  function num(v, fallback) { var n = Number(v); return Number.isFinite(n) && n > 0 ? n : fallback; }
  var accentColor = hex(params.get("accent"), "#D4AF6A");
  var bgColor = hex(params.get("bg"), "#0A0A0A");
  var textColor = hex(params.get("text"), "#F5F1E8");
  var showLive = params.get("live") !== "0";
  var circle = { x: num(params.get("cx"), 150), y: num(params.get("cy"), 140), d: num(params.get("cd"), 700) };
  // How the verse/reference animate in when they change — the same style ids as the Lower
  // Third's "Animate in" picker (see LTAnimationIn in src/lowerthirds/types.ts). The query
  // string is never trusted blindly: anything outside this list falls back to "none".
  var ANIM_IDS = ["slide-left", "slide-right", "slide-up", "slide-down", "fade-in", "fade-up", "fade-down", "zoom-in", "bounce-in", "flip-in", "blur-in", "none"];
  var animParam = params.get("anim");
  var animationIn = ANIM_IDS.indexOf(animParam) !== -1 ? animParam : "none";
  var tabParam = params.get("tab") || "bible";
  var DEFAULT_SLIDE = {
    text: "What advantage then hath the Jew? or what profit is there of circumcision?",
    reference: "Romans 3:1 (KJV)",
  };

  document.querySelector(".paper").style.background = bgColor;
  document.getElementById("liveDot").style.background = accentColor;
  document.getElementById("eyebrow").style.color = accentColor;
  document.getElementById("refText").style.color = accentColor;
  document.getElementById("refBar").style.background = accentColor;
  document.getElementById("divider").style.background = accentColor;
  document.getElementById("verse").style.color = textColor;

  // Thin double-ring: two delicate concentric gold circles with a small gap, thinner than the
  // circle look's thick single cream ring, per the reference design.
  var ringOuter = document.getElementById("ringOuter");
  var ringInner = document.getElementById("ringInner");
  var outerPad = 10, gap = 6;
  ringOuter.style.left = (circle.x - outerPad) + "px";
  ringOuter.style.top = (circle.y - outerPad) + "px";
  ringOuter.style.width = (circle.d + outerPad * 2) + "px";
  ringOuter.style.height = (circle.d + outerPad * 2) + "px";
  ringOuter.style.borderColor = accentColor;
  var innerPad = outerPad - gap;
  ringInner.style.left = (circle.x - innerPad) + "px";
  ringInner.style.top = (circle.y - innerPad) + "px";
  ringInner.style.width = (circle.d + innerPad * 2) + "px";
  ringInner.style.height = (circle.d + innerPad * 2) + "px";
  ringInner.style.borderColor = accentColor;

  // The LIVE row sits left-aligned just below the circle.
  var liveRow = document.getElementById("liveRow");
  if (!showLive) liveRow.style.display = "none";
  liveRow.style.left = circle.x + "px";
  liveRow.style.top = (circle.y + circle.d + 34) + "px";

  // A thin vertical gold divider separates the circle column from the text column.
  var dividerEl = document.getElementById("divider");
  var dividerX = circle.x + circle.d + 70;
  dividerEl.style.left = dividerX + "px";
  dividerEl.style.top = (circle.y - 20) + "px";
  dividerEl.style.height = (circle.d + 40) + "px";

  var rightEl = document.getElementById("right");
  var columnLeft = dividerX + 70;
  var columnRight = 1920 - 90;
  rightEl.style.left = columnLeft + "px";
  rightEl.style.width = Math.max(200, columnRight - columnLeft) + "px";

  // Cut the actual hole: an even-odd SVG mask on the background layer — the whole canvas minus the
  // circle window — so the body's transparency shows through in a clean circle.
  var r = circle.d / 2;
  var cx = circle.x + r, cy = circle.y + r;
  var hole = "M" + (cx - r) + " " + cy + "A" + r + " " + r + " 0 1 0 " + (cx + r) + " " + cy +
    "A" + r + " " + r + " 0 1 0 " + (cx - r) + " " + cy + "Z";
  var maskSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='#000' fill-rule='evenodd' d='M0 0H1920V1080H0Z" + hole + "'/></svg>";
  var holeMask = "url(\"data:image/svg+xml," + encodeURIComponent(maskSvg) + "\")";
  var bg = document.getElementById("bg");
  bg.style.webkitMaskImage = holeMask;
  bg.style.maskImage = holeMask;
  bg.style.webkitMaskSize = bg.style.maskSize = "1920px 1080px";

  // ---- highlight markup, the same syntax and rules every overlay uses: ----
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function safeEmText(text) {
    return escapeHtml(text).replace(/\*(?=\S)(?:\[(#[0-9a-fA-F]{3,8})\])?([^*\n]*?\S)\*/g, function (_m, color, words) {
      return color
        ? '<strong class="verse-em" style="color:' + color + '">' + words + '</strong>'
        : '<strong class="verse-em">' + words + '</strong>';
    });
  }

  // ---- fit the verse to its column ----
  var verseEl = document.getElementById("verse");
  var lastVerseRawText = "";
  function fitVerseText(text) {
    lastVerseRawText = text;
    verseEl.innerHTML = safeEmText(text);
    var maxHeight = 640;
    var size = 92;
    verseEl.style.fontSize = size + "px";
    while (size > 28 && verseEl.scrollHeight > maxHeight) {
      size -= 3;
      verseEl.style.fontSize = size + "px";
    }
  }

  // ---- reference parsing: "John 3:16 (KJV)" -> "JOHN 3:16" + "KJV" ----
  function applyReference(reference) {
    var m = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(String(reference || "").trim());
    document.getElementById("refText").textContent = (m ? m[1] : reference || "").toUpperCase();
    document.getElementById("refVersion").textContent = m ? m[2].toUpperCase() : "";
    document.getElementById("refBar").style.display = m ? "" : "none";
  }

  var refEl = document.getElementById("ref");
  var currentKey = "";
  var swapTimer = null;
  var entranceTimer = null;
  function render(slide) {
    fitVerseText(slide.text || "");
    applyReference(slide.reference || "");
  }
  // Plays the chosen "animate in" style on the verse/reference. Runs instead of (not alongside)
  // the plain cross-fade above: .anim-noTransition suspends that transition for the moment the
  // keyframe animation plays, so the two never visibly double up.
  function playEntrance() {
    if (animationIn === "none") return;
    clearTimeout(entranceTimer);
    [verseEl, refEl].forEach(function (el) {
      el.classList.remove("anim-play");
      el.classList.add("anim-noTransition", "anim-" + animationIn);
    });
    // Force a reflow so re-adding "anim-play" on the same element restarts the animation.
    void verseEl.offsetWidth;
    [verseEl, refEl].forEach(function (el) { el.classList.add("anim-play"); });
    entranceTimer = setTimeout(function () {
      [verseEl, refEl].forEach(function (el) {
        el.classList.remove("anim-noTransition", "anim-play", "anim-" + animationIn);
      });
    }, 600);
  }
  function show(slide) {
    var key = (slide.text || "") + "|" + (slide.reference || "");
    if (!slide.text || key === currentKey) return;
    var first = !currentKey;
    currentKey = key;
    clearTimeout(swapTimer);
    if (first) { render(slide); playEntrance(); return; }
    verseEl.classList.add("swap");
    refEl.classList.add("swap");
    swapTimer = setTimeout(function () {
      render(slide);
      verseEl.classList.remove("swap");
      refEl.classList.remove("swap");
      playEntrance();
    }, 300);
  }
  function hide() { /* keep the last verse on screen */ }

  show(DEFAULT_SLIDE);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fitVerseText(lastVerseRawText); });
  }

  // ---- receiving verse data: the same transports every overlay uses ----
  var lastRevision = 0;
  function handlePacket(packet) {
    if (!packet || typeof packet !== "object") return;
    if (packet.channel && packet.channel !== tabParam) return;
    var data = packet.data && typeof packet.data === "object" ? packet.data : packet;
    var revision = Number(data.revision ?? data.timestamp ?? 0);
    if (revision && revision < lastRevision) return;
    if (revision) lastRevision = revision;
    if (data.live && data.slide && !data.blanked) show(data.slide);
    else hide();
  }

  function readFromLocalStorage() {
    try {
      var raw = localStorage.getItem("bible-overlay-data");
      if (raw) handlePacket(JSON.parse(raw));
    } catch (e) { /* storage may be unavailable inside OBS */ }
  }

  function readFromHash() {
    try {
      var hash = location.hash.replace(/^#/, "");
      if (!hash.startsWith("data=")) return;
      handlePacket(JSON.parse(decodeURIComponent(hash.slice(5))));
    } catch (e) { /* malformed hash */ }
  }

  function connectRelay() {
    if (!("WebSocket" in window)) return;
    var attempts = 0, timer = null, disabledUntil = 0;
    function schedule() {
      if (timer) return;
      if (attempts >= 3) {
        disabledUntil = Date.now() + 60000;
        attempts = 0;
        timer = setTimeout(function () { timer = null; open(); }, 60000);
        return;
      }
      var delay = Math.min(10000, 500 * Math.pow(2, attempts++));
      timer = setTimeout(function () { timer = null; open(); }, delay);
    }
    function open() {
      if (Date.now() < disabledUntil) return;
      try {
        var ws = new WebSocket("ws://127.0.0.1:17891");
        ws.onopen = function () { attempts = 0; };
        ws.onmessage = function (e) { try { handlePacket(JSON.parse(e.data)); } catch (err) { /* ignore */ } };
        ws.onclose = schedule;
        ws.onerror = function () { try { ws.close(); } catch (err) { /* already closing */ } };
      } catch (e) { schedule(); }
    }
    open();
  }

  readFromHash();
  window.addEventListener("hashchange", readFromHash);
  // ?preview=1 is the in-app editor: it shows only the sample verse it passes in the hash and
  // never listens for live verses.
  if (params.get("preview")) return;
  readFromLocalStorage();
  connectRelay();
  try {
    var bc = new BroadcastChannel("obs-church-studio-bible-overlay");
    bc.onmessage = function (e) { handlePacket(e.data); };
  } catch (e) { /* BroadcastChannel unavailable in this OBS build */ }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MakeChurchEazy — Dock</title>
  <script>
    (() => {
      const appEnv = "%VITE_APP_ENV%" || "development";
      const isTestEnv = appEnv !== "production";
      window.__MCE_DOCK_TEST_ENV__ = isTestEnv;

      if (isTestEnv) {
        document.title = "MakeChurchEazy Test — Dock";
        document.documentElement.dataset.mceEnv = "test";
      }

      try {
        const pref = localStorage.getItem("obs-church-studio.theme-preference");
        const useLightMode =
          pref === "light" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);

        if (useLightMode) {
          document.documentElement.classList.add("light");
        }
      } catch {
        // Ignore storage access issues inside OBS.
      }
    })();
  </script>
  <!-- ════════════════════════════════════════════════════════════
       ZOOM GUARD — Prevent dock zoom from affecting live overlays
       
       OBS Browser Source uses Chromium/CEF where zoom is applied
       per domain. If the dock and overlay share the same origin,
       zooming the dock (Ctrl+/-) can resize the live output.
       
       This guard:
       1. Intercepts keyboard zoom shortcuts (Ctrl+/-/0, Cmd variants)
       2. Blocks Ctrl/Cmd+wheel zoom
       3. Blocks pinch-to-zoom
       4. Monitors and logs if zoom changes despite prevention
       ════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      var ZOOM_LOCK_KEY = "mce-zoom-lock-active";

      function isZoomActive() {
        return window.devicePixelRatio > 1.01 || 
               (window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01);
      }

      // 1. Block keyboard zoom shortcuts (capture phase to beat React)
      document.addEventListener("keydown", function(e) {
        var ctrl = e.ctrlKey || e.metaKey;
        if (!ctrl) return;
        var key = e.key;
        // Ctrl+=, Ctrl+-, Ctrl+0 (Numpad variants, main keyboard)
        if (key === "=" || key === "-" || key === "0" ||
            key === "Plus" || key === "Minus" ||
            key === "NumpadAdd" || key === "NumpadSubtract" || key === "Numpad0") {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // 2. Block Ctrl/Cmd + scroll wheel zoom
      document.addEventListener("wheel", function(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      // 3. Block pinch-zoom / gesture events
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });

      // 4. Monitor zoom — if it changes despite prevention, flag it
      var zoomWarningShown = false;
      setInterval(function() {
        if (isZoomActive()) {
          if (!zoomWarningShown) {
            zoomWarningShown = true;
            console.warn(
              "[ZoomGuard] Dock zoom changed! This can affect live overlay Browser Sources. " +
              "Resetting zoom with Ctrl+0 or Cmd+0 is recommended."
            );
          }
        } else {
          zoomWarningShown = false;
        }
      }, 2000);
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* Prevent FOUC — match dock background */
    html,
    body,
    #dock-root {
      margin: 0;
      padding: 0;
      background: #1a1c25;
      color: #e8e8ea;
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
      -ms-content-zooming: none;
    }

    html.light,
    html.light body,
    html.light #dock-root {
      background: #f4f5f7;
      color: #1a1d23;
    }

    .dock-test-env-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(127, 29, 29, 0.96);
      border-bottom: 1px solid #f59e0b;
      color: #fff7ed;
      font-family: "Inter", "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
    }

    html[data-mce-env="test"] .dock-test-env-banner {
      display: flex;
    }

    /* Start the Dock below the banner so nothing at the top (e.g. the vMix card) hides under it. */
    html[data-mce-env="test"] #dock-root {
      height: calc(100% - 29px);
      margin-top: 29px;
    }

    .dock-test-env-banner__badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #f59e0b;
      color: #7f1d1d;
    }

  </style>
</head>

<body>
  <div class="dock-test-env-banner" aria-hidden="true">
    <span class="dock-test-env-banner__badge">TEST</span>
    <span>Testing environment only. Use the local test desktop app on this machine.</span>
  </div>
  <div id="dock-root"></div>
  <script type="module" src="/src/dock/dock-main.tsx"></script>
</body>

</html>

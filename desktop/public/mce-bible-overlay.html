<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MCE Bible Overlay</title>
  <link href="/fonts/google/google-fonts.css" rel="stylesheet">
  <link href="/fonts/cmg-sans-fonts.css" rel="stylesheet">
  <script>
    (function() {
      document.addEventListener("keydown", function(e) { var c = e.ctrlKey || e.metaKey; if (!c) return; var k = e.key; if (k === "=" || k === "-" || k === "0" || k === "Plus" || k === "Minus" || k === "NumpadAdd" || k === "NumpadSubtract" || k === "Numpad0") { e.preventDefault(); e.stopPropagation(); } }, true);
      document.addEventListener("wheel", function(e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <style>html,body,#overlay-root,#overlay-bg-buffer{touch-action:pan-y;-ms-content-zooming:none;}</style>
  <!-- ════════════════════════════════════════════════════════════
       VIEWPORT SCALING — Internal 1920×1080 canvas with
       viewport-based scale to decouple rendering from browser zoom.
       ════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      var W = 1920, H = 1080;
      var stage = null;
      function fit() {
        stage = stage || document.getElementById('overlay-stage');
        if (!stage) return;
        var vw0 = window.innerWidth || document.documentElement.clientWidth || W;
        var vh0 = window.innerHeight || document.documentElement.clientHeight || H;
        // A screen taller than 16:9 (16:10, 4:3) gets a taller canvas of the same width, so the page fills the
        // whole height instead of stopping short; a wider screen keeps the 16:9 canvas centred as before.
        var HH = Math.max(H, Math.round(W * vh0 / Math.max(1, vw0)));
        document.documentElement.style.height = HH + 'px';
        document.body.style.height = HH + 'px';
        stage.style.width = W + 'px';
        stage.style.height = HH + 'px';
        stage.style.transformOrigin = '0 0';
        stage.style.position = 'absolute';
        stage.style.top = '0';
        stage.style.left = '0';
        var viewportWidth = window.innerWidth || document.documentElement.clientWidth || W;
        var viewportHeight = window.innerHeight || document.documentElement.clientHeight || H;
        var s = Math.min(viewportWidth / W, viewportHeight / HH);
        stage.style.transform = 'scale(' + Math.max(0.01, s) + ')';
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fit, { once: true });
      } else {
        fit();
      }
      window.addEventListener('resize', fit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    })();
  </script>
  <style>
    /* ── Shared: Font-face ── */
    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Charis SIL';
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* ── Shared: Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'CMG Sans', 'Charis SIL', 'Noto Sans', Arial, sans-serif;
      background: transparent !important;
      color: #ffffff;
    }

    :root {
      --font-size: 48px;
      --font-family: 'CMG Sans', 'Charis SIL', 'Noto Sans', Arial, sans-serif;
      --font-color: #ffffff;
      --font-weight: 900;
      --font-style: normal;
      --line-height: 1.6;
      --letter-spacing: 0px;
      --word-spacing: 0px;
      --paint-order: stroke fill;
      --text-align: center;
      --text-shadow: 4px 5px 2px rgba(0, 0, 0, 0.95);
      --outline-width: 4px;
      --outline-color: #000000;
      --ref-font-size: 34px;
      --ref-font-family: var(--font-family);
      --ref-font-weight: 900;
      --ref-font-style: normal;
      --ref-font-color: var(--font-color);
      --ref-text-transform: none;
      --ref-letter-spacing: 0px;
      --ref-opacity: 1;
      --ref-spacing: 24px;
      --ref-text-align: center;
      --ref-align-self: center;
      --ref-width: 100%;
      --ref-anchor-margin-left: auto;
      --ref-anchor-margin-right: auto;
      --ref-bg-color: transparent;
      --ref-bg-padding: 0;
      --ref-bg-radius: 0;
      --ref-bg-border: none;
      --bg-color: transparent;
      --bg-image: none;
      --bg-opacity: 1;
      --bg-shade-gradient: linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
      --bg-shade-display: block;
      --lt-bg-shade-opacity: 0;
      --padding: 60px;
      --safe-area: 40px;
      --anim-duration: 152ms;
      --bg-enter-duration: 64ms;
      --text-enter-duration: 82ms;
      --text-enter-delay: 12ms;
      --text-transform: none;
      --logo-size: 80px;
      --compare-left-width: 40fr;
      --compare-right-width: 40fr;
      --compare-gap: 40px;
      --compare-outer-padding-top: var(--padding);
      --compare-outer-padding-right: var(--padding);
      --compare-outer-padding-bottom: var(--padding);
      --compare-outer-padding-left: var(--padding);
      --compare-panel-inner-padding: 38px;
      --compare-reference-verse-spacing: 10px;
      --compare-reference-align: var(--ref-text-align, center);
      --compare-inline-align: var(--ref-align-self, center);
      --compare-reference-transform: var(--ref-text-transform, none);
    }

    html {
      background: transparent !important;
    }

    /* Layer themes (#mtl-theme-host) own their fonts: each layer picks its own in the Theme Creator. */
    body,
    body *:not(.material-icons):not(.material-icons-outlined):not(.material-icons-round):not(.material-icons-sharp):not(.material-symbols-outlined):not(.fa):not([class^="fa-"]):not([class*=" fa-"]):not(#mtl-theme-host):not(#mtl-theme-host *) {
      font-family: var(--mce-output-font-family, var(--font-family)) !important;
    }

    /* ── Shared: Background layers ── */
    #background {
      position: absolute;
      inset: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      opacity: var(--bg-opacity);
      z-index: 0;
    }

    #bg-crossfade {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    /* ── Shared: Logo ── */
    #logo {
      position: absolute;
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo.visible {
      display: block;
      opacity: 1;
    }

    #logo.bottom-right {
      bottom: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.bottom-left {
      bottom: var(--safe-area);
      left: var(--safe-area);
    }

    #logo.top-right {
      top: var(--safe-area);
      right: var(--safe-area);
    }

    #logo.top-left {
      top: var(--safe-area);
      left: var(--safe-area);
    }

    /* ── Shared: Verse container ── */
    #verse-container {
      display: flex;
      flex-direction: column;
      align-items: var(--content-align-self, center);
      justify-content: center;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #verse-text {
      order: 1;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      font-size: var(--font-size);
      font-family: var(--font-family);
      color: var(--font-color, #ffffff);
      font-weight: var(--font-weight, 400);
      font-style: var(--font-style, normal);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing, 0px);
      word-spacing: var(--word-spacing, 0px);
      text-align: var(--text-align);
      text-shadow: var(--text-shadow);
      paint-order: stroke fill;
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      white-space: pre-line;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    #verse-text .verse-text__line,
    #lt-verse-text .verse-text__line,
    .compare-column__verse .verse-text__line,
    .lt-compare-col .verse-text__line {
      display: block;
      position: relative;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    #verse-text .verse-em,
    #lt-verse-text .verse-em,
    .compare-column__verse .verse-em,
    .lt-compare-col .verse-em { font-weight: 800; color: var(--verse-number-color, inherit); }

    #verse-text .verse-text__number,
    #lt-verse-text .verse-text__number,
    .compare-column__verse .verse-text__number,
    .lt-compare-col .verse-text__number {
      position: absolute;
      left: 0;
      top: 0;
      min-width: 1.2em;
      width: auto;
      font-size: 0.5em;
      line-height: 1.15;
      font-weight: 700;
      text-align: right;
      opacity: 0.82;
      -webkit-text-stroke: 0 transparent;
      white-space: nowrap;
    }

    #verse-text .verse-text__body,
    #lt-verse-text .verse-text__body,
    .compare-column__verse .verse-text__body,
    .lt-compare-col .verse-text__body {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    #verse-text .verse-text__line + .verse-text__line,
    #lt-verse-text .verse-text__line + .verse-text__line,
    .compare-column__verse .verse-text__line + .verse-text__line,
    .lt-compare-col .verse-text__line + .verse-text__line {
      margin-top: 0.18em;
    }

    #reference {
      font-size: var(--ref-font-size);
      font-family: var(--ref-font-family);
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--ref-text-align, var(--text-align));
      align-self: var(--ref-align-self, center);
      margin-top: var(--ref-spacing);
      width: var(--ref-width);
      max-width: 100%;
      box-sizing: border-box;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--ref-text-transform);
      letter-spacing: var(--ref-letter-spacing);
      text-shadow: var(--text-shadow);
      paint-order: stroke fill;
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      order: 2;
    }

    #reference.top {
      margin-top: 0;
      margin-bottom: var(--ref-spacing);
      order: 0;
    }

    #reference:empty {
      display: none;
    }

    #overlay.ref-anchor-top #verse-container {
      padding-top: calc(var(--ref-font-size) + var(--ref-spacing) + 18px);
      box-sizing: border-box;
    }

    #overlay.ref-anchor-bottom #verse-container {
      padding-bottom: calc(var(--ref-font-size) + var(--ref-spacing) + 18px);
      box-sizing: border-box;
    }

    #overlay.ref-anchor-top #reference,
    #overlay.ref-anchor-bottom #reference {
      position: absolute;
      left: var(--padding, 64px);
      right: var(--padding, 64px);
      width: var(--ref-width);
      max-width: calc(100% - (var(--padding, 64px) * 2));
      margin: 0;
      margin-left: var(--ref-anchor-margin-left, auto);
      margin-right: var(--ref-anchor-margin-right, auto);
      z-index: 4;
    }

    #overlay.ref-anchor-top #reference {
      top: var(--padding, 64px);
    }

    #overlay.ref-anchor-bottom #reference {
      bottom: var(--padding, 64px);
    }

    /* ══════════════════════════════════════════════════════
       FULLSCREEN LAYER (always inset:0, crossfades via opacity)
       ══════════════════════════════════════════════════════ */
    #background-shade {
      position: absolute;
      inset: 0;
      background: var(--bg-shade-gradient);
      display: var(--bg-shade-display);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
      z-index: 2;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--padding, 64px);
      opacity: 1;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #overlay.hidden,
    #overlay.blank {
      opacity: 0;
    }

    #verse-container {
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #verse-container.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Compare layout (fullscreen only) */
    #compare-layout {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, var(--compare-left-width, 40fr)) minmax(0, var(--compare-right-width, 40fr));
      gap: var(--compare-gap, 40px);
      width: 100%;
      height: 100%;
      padding: var(--compare-outer-padding-top, var(--padding)) var(--compare-outer-padding-right, var(--padding)) var(--compare-outer-padding-bottom, var(--padding)) var(--compare-outer-padding-left, var(--padding));
      align-content: center;
      align-items: stretch;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--anim-duration, 152ms) ease;
    }

    #compare-layout.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #compare-layout.is-multi-passage {
      grid-template-columns: repeat(var(--compare-column-count, 2), minmax(0, 1fr));
      align-content: center;
      justify-content: center;
      justify-items: stretch;
    }

    #compare-layout .compare-column--line-hidden {
      display: none;
    }

    #compare-layout.is-multi-passage .compare-column {
      align-items: center;
      text-align: center;
    }

    #compare-layout.is-multi-passage .compare-column__verse,
    #compare-layout.is-multi-passage .compare-column__reference,
    #compare-layout.is-multi-passage .compare-column__translation {
      text-align: center;
    }

    #compare-layout.is-line-by-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      justify-items: center;
    }

    .compare-column {
      display: flex;
      flex-direction: column;
      /* Keep shorter translations centered against longer translations. */
      justify-content: center;
      padding: var(--compare-panel-inner-padding, 38px);
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .compare-column__text-wrap {
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
    }

    .compare-column__verse {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      font-size: var(--compare-font-size, 36px);
      font-family: var(--compare-font-family, var(--font-family));
      color: var(--font-color, #ffffff);
      font-weight: var(--compare-font-weight, var(--font-weight, 400));
      font-style: var(--font-style, normal);
      line-height: var(--compare-line-height, 1.4);
      letter-spacing: var(--letter-spacing, 0px);
      word-spacing: var(--word-spacing, 0px);
      text-align: var(--compare-text-align, var(--text-align));
      text-shadow: var(--text-shadow);
      paint-order: stroke fill;
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
      text-transform: var(--text-transform);
      white-space: pre-line;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .compare-column__reference {
      font-size: var(--compare-ref-font-size, 20px);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      color: var(--ref-font-color);
      text-align: var(--compare-reference-align, var(--ref-text-align, var(--compare-text-align, var(--text-align))));
      align-self: var(--compare-inline-align, center);
      margin-top: var(--compare-reference-verse-spacing, 10px);
      width: var(--ref-width);
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      opacity: var(--ref-opacity);
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
      text-shadow: var(--text-shadow);
      paint-order: stroke fill;
      -webkit-text-stroke: var(--outline-width) var(--outline-color);
    }

    #compare-layout.is-line-by-line .compare-column__reference {
      align-self: center;
      width: fit-content;
      max-width: 100%;
      text-align: center;
    }

    #compare-layout.is-line-by-line .compare-column {
      align-items: stretch;
      justify-content: center;
      width: 100%;
      max-width: none;
      max-height: 100%;
      margin: 0;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    #compare-layout.is-line-by-line .compare-column__text-wrap {
      align-items: stretch;
      justify-content: stretch;
      width: 100%;
      max-height: 100%;
    }

    #compare-layout.is-line-by-line .compare-column__verse {
      width: 100%;
      max-width: none;
      text-align: center;
    }

    #compare-layout.is-line-by-line .compare-column--line-hidden {
      display: none;
    }

    .compare-line-list {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.4vh, 28px);
      width: 100%;
      max-width: none;
    }

    .compare-line-unit {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.34em;
      width: 100%;
      min-width: 0;
    }

    .compare-line-unit__translation {
      align-self: center;
      width: fit-content;
      max-width: 100%;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border: var(--ref-bg-border);
      border-radius: var(--ref-bg-radius);
      color: var(--ref-font-color);
      font-family: var(--compare-font-family, var(--ref-font-family));
      font-size: max(12px, calc(var(--compare-ref-font-size, 20px) * 0.72));
      font-weight: var(--ref-font-weight);
      font-style: var(--ref-font-style, normal);
      letter-spacing: var(--ref-letter-spacing);
      line-height: 1;
      opacity: var(--ref-opacity);
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      text-shadow: none;
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      white-space: nowrap;
      -webkit-text-stroke: 0 transparent;
    }

    .compare-line-unit__text {
      width: 100%;
      max-width: none;
      min-width: 0;
      text-align: var(--compare-text-align, var(--text-align));
    }

    #compare-layout.is-line-by-line .compare-line-unit__text {
      text-align: center;
    }

    .compare-column__reference.is-above {
      order: -1;
      margin-top: 0;
      margin-bottom: var(--compare-reference-verse-spacing, 10px);
    }

    .compare-column__reference.is-hidden,
    .compare-column__reference:empty {
      display: none;
    }

    .compare-column__translation {
      display: none;
      font-size: var(--compare-ref-meta-size, 12px);
      color: rgba(255, 255, 255, 0.5);
      text-align: var(--text-align);
      margin-top: 4px;
    }

    /* ── Lower-third compare layout ── */
    .lt-compare-row {
      display: flex;
      align-items: stretch;
      gap: 16px;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }
    .lt-compare-row .lt-compare-unit {
      flex: 1 1 0;
      min-width: 0;
    }
    .lt-compare-row .lt-compare-divider {
      width: 1px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      align-self: stretch;
    }
    .lt-compare-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }
    .lt-compare-stack .lt-compare-divider {
      height: 1px;
      background: rgba(255,255,255,0.15);
      width: 100%;
    }
    .lt-compare-unit {
      display: flex;
      flex-direction: column;
      align-items: var(--compare-inline-align, center);
      min-width: 0;
    }
    .lt-compare-ref {
      display: block;
      font-size: 0.65em;
      color: var(--ref-font-color, rgba(255,255,255,0.55));
      margin-bottom: var(--compare-reference-verse-spacing, 10px);
      max-width: 100%;
      width: fit-content;
      padding: var(--ref-bg-padding);
      background: var(--ref-bg-color);
      border-radius: var(--ref-bg-radius);
      border: var(--ref-bg-border);
      text-align: var(--compare-reference-align, var(--ref-text-align, center));
      text-transform: var(--compare-reference-transform, var(--ref-text-transform));
      letter-spacing: var(--ref-letter-spacing);
      white-space: normal;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-overflow: clip;
    }
    .lt-compare-col {
      display: block;
      width: 100%;
      text-align: var(--compare-text-align, var(--text-align, center));
    }

    #lt-verse-text.is-multi-passage .lt-compare-row,
    #lt-verse-text.is-multi-passage .lt-compare-unit,
    #lt-verse-text.is-multi-passage .lt-compare-col,
    #lt-verse-text.is-multi-passage .lt-compare-ref {
      align-items: center;
      text-align: center;
    }

    /* ══════════════════════════════════════════════════════

  <script>
    (function () {
      'use strict';

      let currentBibleState = null;
      let currentBibleRevision = 0;
      let hasReceivedLiveOverlayUpdate = false;

      const SIZE_PRESETS = {
        'smallest': { fontSize: 24, refFontSize: 18, lineHeight: 1.25 },
        'smaller': { fontSize: 28, refFontSize: 20, lineHeight: 1.26 },
        'small': { fontSize: 32, refFontSize: 24, lineHeight: 1.27 },
        'medium': { fontSize: 36, refFontSize: 26, lineHeight: 1.28 },
        'big': { fontSize: 48, refFontSize: 34, lineHeight: 1.3 },
        'bigger': { fontSize: 60, refFontSize: 42, lineHeight: 1.32 },
        'biggest': { fontSize: 72, refFontSize: 50, lineHeight: 1.34 },
      };
      const WIDTH_PRESETS = {
        'sm': { maxWidth: 1000, hMargin: 460 },
        'md': { maxWidth: 1200, hMargin: 360 },
        'lg': { maxWidth: 1440, hMargin: 240 },
        'xl': { maxWidth: 1680, hMargin: 120 },
        'xxl': { maxWidth: 1800, hMargin: 60 },
        'full': { maxWidth: 1920, hMargin: 0 },
      };

      function escapeHtml(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
      function safeSupText(h) {
        if (typeof h !== 'string') return '';
        return h.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      // *words* = important words: bold, in the number/accent colour when the theme sets one.
      // *[#facc15]words* = the same, in the colour picked in the Dock (hex only, so nothing else can get in).
      function safeEmText(h) {
        return safeSupText(h).replace(/\*(?=\S)(?:\[(#[0-9a-fA-F]{3,8})\])?([^*\n]*?\S)\*/g, function (_m, color, words) {
          return color
            ? '<strong class="verse-em" style="color:' + color + '">' + words + '</strong>'
            : '<strong class="verse-em">' + words + '</strong>';
        });
      }
      function renderVerseLines(text, lineCount) {
        if (typeof text !== 'string') return '';
        const hideVerseNumbers = Number(lineCount) === 1;
        return text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const match = line.match(/^(?:\[(\d+)\]|(\d+)[.)])\s+([\s\S]+)$/);
            if (!match || hideVerseNumbers) return `<span class="verse-text__line"><span class="verse-text__body">${safeEmText(match ? match[3] : line)}</span></span>`;
            const number = match[1] || match[2];
            return `<span class="verse-text__line"><span class="verse-text__number" aria-hidden="true">${safeSupText(number)}</span><span class="verse-text__body">${safeEmText(match[3])}</span></span>`;
          })
          .join('');
      }

      function positionVerseNumbers(rootNode) {
        if (!rootNode) return;
        const stage = document.getElementById('overlay-stage');
        const stageRect = stage?.getBoundingClientRect();
        const stageWidth = stage?.offsetWidth || 1920;
        const stageHeight = stage?.offsetHeight || 1080;
        const scaleX = stageRect?.width > 0 ? stageRect.width / stageWidth : 1;
        const scaleY = stageRect?.height > 0 ? stageRect.height / stageHeight : 1;
        const rootFontSize = Number.parseFloat(getComputedStyle(rootNode).fontSize) || 48;
        const gap = Math.max(3, rootFontSize * 0.12);

        const lines = rootNode.querySelectorAll('.verse-text__line');
        if (!lines || lines.length === 0) return;

        // Reset any previous padding so we can measure clean unpadded geometry
        lines.forEach((line) => {
          line.style.paddingLeft = '0px';
          line.style.paddingRight = '0px';
        });

        // Pass 1: measure maximum marker space needed so we can reserve space
        // symmetrically for centered text or on the left for left-aligned text.
        let maxMarkerSpace = 0;
        lines.forEach((line) => {
          const marker = line.querySelector('.verse-text__number');
          if (!marker) return;
          const markerRect = marker.getBoundingClientRect();
          const markerWidth = marker.offsetWidth || (markerRect.width / scaleX);
          maxMarkerSpace = Math.max(maxMarkerSpace, markerWidth + gap);
        });

        if (maxMarkerSpace > 0) {
          const reserveSpace = Math.ceil(maxMarkerSpace);
          const computedAlign = getComputedStyle(rootNode).textAlign;
          const isCenter = computedAlign === 'center';
          const isRight = computedAlign === 'right';

          lines.forEach((line) => {
            const marker = line.querySelector('.verse-text__number');
            if (marker) {
              if (isCenter) {
                // Symmetric padding preserves exact screen centering of the text
                line.style.paddingLeft = `${reserveSpace}px`;
                line.style.paddingRight = `${reserveSpace}px`;
              } else if (isRight) {
                line.style.paddingLeft = '0px';
                line.style.paddingRight = `${reserveSpace}px`;
              } else {
                line.style.paddingLeft = `${reserveSpace}px`;
                line.style.paddingRight = '0px';
              }
            } else {
              line.style.paddingLeft = '0px';
              line.style.paddingRight = '0px';
            }
          });
        }

        // Pass 2: Position markers immediately beside the first rendered character of the verse
        lines.forEach((line) => {
          const marker = line.querySelector('.verse-text__number');
          const body = line.querySelector('.verse-text__body');
          if (!marker || !body) return;

          let firstCharRect = null;
          try {
            const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
            let textNode = null;
            while (walker.nextNode()) {
              if (walker.currentNode.textContent && walker.currentNode.textContent.trim().length > 0) {
                textNode = walker.currentNode;
                break;
              }
            }
            if (textNode) {
              const nonWsIndex = textNode.textContent.search(/\S/);
              const charIndex = nonWsIndex >= 0 ? nonWsIndex : 0;
              const range = document.createRange();
              range.setStart(textNode, charIndex);
              range.setEnd(textNode, Math.min(charIndex + 1, textNode.textContent.length));
              const rects = range.getClientRects();
              firstCharRect = (rects && rects.length > 0) ? rects[0] : range.getBoundingClientRect();
            }
          } catch (_) { }

          if (!firstCharRect || firstCharRect.width === 0) {
            const range = document.createRange();
            range.selectNodeContents(body);
            firstCharRect = Array.from(range.getClientRects()).find((r) => r.width > 0 && r.height > 0);
          }
          if (!firstCharRect) return;

          const lineRect = line.getBoundingClientRect();
          const markerRect = marker.getBoundingClientRect();
          const markerWidth = marker.offsetWidth || (markerRect.width / scaleX);
          const markerHeight = marker.offsetHeight || (markerRect.height / scaleY);
          const firstCharLeft = (firstCharRect.left - lineRect.left) / scaleX;
          const firstCharTop = (firstCharRect.top - lineRect.top) / scaleY;
          const firstCharHeight = firstCharRect.height / scaleY;

          marker.style.left = `${firstCharLeft - markerWidth - gap}px`;
          marker.style.top = `${firstCharTop + ((firstCharHeight - markerHeight) / 2)}px`;
        });
      }

      function positionAllVerseNumbers() {
        [verseText, ltVerseText, compareTextLeft, compareTextRight, compareTextThird]
          .forEach(positionVerseNumbers);
      }

      const PATTERN_CSS = {
        'dots': 'url("data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'2\' cy=\'2\' r=\'1.5\' fill=\'rgba(255,255,255,0.15)\'/%3E%3C/svg%3E")',
        'lines': 'url("data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cline x1=\'0\' y1=\'20\' x2=\'40\' y2=\'20\' stroke=\'rgba(255,255,255,0.08)\' stroke-width=\'1\'/%3E%3C/svg%3E")',

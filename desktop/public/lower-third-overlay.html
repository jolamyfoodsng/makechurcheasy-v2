<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lower Third Overlay</title>
  <!-- Local Tailwind CSS (bundled for offline use) -->
  <link href="/tailwind.min.css" rel="stylesheet" />

  <!-- Local Google Fonts (Noto Sans, Material Icons, Inter, Work Sans, Montserrat, etc.) -->
  <link href="/fonts/google/google-fonts.css" rel="stylesheet" />

  <!-- Local Font Awesome (for themes that use it) -->
  <link href="/fonts/fontawesome/all.min.css" rel="stylesheet" />

  <!-- CMG Sans -->
  <link href="/fonts/cmg-sans-fonts.css" rel="stylesheet" />

  <!-- Dynamic font imports container (populated by JS when theme has fontImports) -->
  <div id="dynamic-fonts"></div>

  <style id="theme-css"></style>

  <style>
    @font-face {
      font-family: 'Charis SIL';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/charis-sil/CharisSIL-Regular.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Charis SIL';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/charis-sil/CharisSIL-Bold.ttf') format('truetype');
    }

    /* Base reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #overlay-root,
    #overlay-bg-buffer {
      /* zoom: 0.3; */
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Charis SIL", "CMG Sans", "Noto Sans", sans-serif;
    }

    body {
      position: relative;
    }

    /* Container for the rendered theme */
    #overlay-root,
    #overlay-bg-buffer {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #overlay-bg-buffer {
      pointer-events: none;
      z-index: 0;
    }

    #overlay-root {
      z-index: 1;
      opacity: 1;
      transition: opacity 260ms ease;
      /* zoom: 0.35 !important; */
    }

    .lt-fit-frame {
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      transform-origin: var(--lt-fit-origin, left bottom);
      will-change: transform;
    }

    #overlay-root.exit-fading {
      opacity: 0;
    }

    /* Size-driven overrides — applied via CSS custom properties */
    #overlay-root[data-size]>*,
    #overlay-bg-buffer[data-size]>* {
      max-width: var(--lt-width, none) !important;
      width: var(--lt-width, auto) !important;
    }

    /* Height override */
    #overlay-root[style*="--lt-height"]>*,
    #overlay-bg-buffer[style*="--lt-height"]>* {
      min-height: var(--lt-height, auto) !important;
    }

    /* Also override Tailwind max-width classes */
    #overlay-root[data-size] .max-w-2xl,
    #overlay-root[data-size] .max-w-3xl,
    #overlay-root[data-size] .max-w-4xl,
    #overlay-root[data-size] .max-w-5xl,
    #overlay-root[data-size] .max-w-xl,
    #overlay-bg-buffer[data-size] .max-w-2xl,
    #overlay-bg-buffer[data-size] .max-w-3xl,
    #overlay-bg-buffer[data-size] .max-w-4xl,
    #overlay-bg-buffer[data-size] .max-w-5xl,
    #overlay-bg-buffer[data-size] .max-w-xl {
      max-width: 100% !important;
    }

    /* Hidden state */
    #overlay-root.hidden-state,
    #overlay-bg-buffer.hidden-state {
      opacity: 0;
      pointer-events: none;
    }

    #overlay-bg-buffer.snapshot-active,
    #overlay-bg-buffer.snapshot-active * {
      animation: none !important;
      transition: none !important;
      text-shadow: none !important;
      caret-color: transparent !important;
    }

    #overlay-bg-buffer.snapshot-active,
    #overlay-bg-buffer.snapshot-active * {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
    }

    #overlay-bg-buffer.snapshot-active img,
    #overlay-bg-buffer.snapshot-active svg,
    #overlay-bg-buffer.snapshot-active video,
    #overlay-bg-buffer.snapshot-active canvas,
    #overlay-bg-buffer.snapshot-active .material-icons,
    #overlay-bg-buffer.snapshot-active .fa,
    #overlay-bg-buffer.snapshot-active .fab,
    #overlay-bg-buffer.snapshot-active .fas,
    #overlay-bg-buffer.snapshot-active .far,
    #overlay-bg-buffer.snapshot-active .fal,
    #overlay-bg-buffer.snapshot-active .fad {
      opacity: 0 !important;
    }

    /* ════════════════════════════════════════════
       Animation Keyframes — Entry
       ════════════════════════════════════════════ */

    /* Slide from left */
    @keyframes lt-slide-left {
      0% {
        transform: translateX(-110%);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Slide from right */
    @keyframes lt-slide-right {
      0% {
        transform: translateX(110%);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Slide from bottom */
    @keyframes lt-slide-up {
      0% {
        transform: translateY(110%);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Slide from top */
    @keyframes lt-slide-down {
      0% {
        transform: translateY(-110%);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Fade in */
    @keyframes lt-fade-in {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    /* Fade up */
    @keyframes lt-fade-up {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade down */
    @keyframes lt-fade-down {
      0% {
        opacity: 0;
        transform: translateY(-30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Zoom in */
    @keyframes lt-zoom-in {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Bounce in */
    @keyframes lt-bounce-in {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }

      70% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Flip in */
    @keyframes lt-flip-in {
      0% {
        transform: perspective(600px) rotateX(-90deg);
        opacity: 0;
      }

      60% {
        transform: perspective(600px) rotateX(10deg);
        opacity: 1;
      }

      100% {
        transform: perspective(600px) rotateX(0);
        opacity: 1;
      }
    }

    /* Blur in */
    @keyframes lt-blur-in {
      0% {
        filter: blur(12px);
        opacity: 0;
      }

      100% {
        filter: blur(0);
        opacity: 1;
      }
    }

    /* ════════════════════════════════════════════
       Animation Keyframes — Exit
       ════════════════════════════════════════════ */

    @keyframes lt-slide-out-right {
      0% {
        transform: translateX(0);
        opacity: 1;
      }

      40% {
        opacity: 1;
      }

      100% {
        transform: translateX(110%);
        opacity: 0;
      }
    }

    @keyframes lt-fade-scale-out {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(0.85);
        opacity: 0;
      }
    }

    /* Reverse exit animations (reverse of entry) */
    @keyframes lt-slide-out-left {
      0% {
        transform: translateX(0);
        opacity: 1;
      }

      100% {
        transform: translateX(-110%);
        opacity: 0;
      }
    }

    @keyframes lt-slide-out-down {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(110%);
        opacity: 0;
      }
    }

    @keyframes lt-slide-out-up {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(-110%);
        opacity: 0;
      }
    }

    @keyframes lt-fade-out {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes lt-fade-out-down {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(30px);
      }
    }

    @keyframes lt-fade-out-up {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }

    @keyframes lt-zoom-out {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(0.5);
        opacity: 0;
      }
    }

    @keyframes lt-bounce-out {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      30% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(0.3);
        opacity: 0;
      }
    }

    @keyframes lt-flip-out {
      0% {
        transform: perspective(600px) rotateX(0);
        opacity: 1;
      }

      100% {
        transform: perspective(600px) rotateX(90deg);
        opacity: 0;
      }
    }

    @keyframes lt-blur-out {
      0% {
        filter: blur(0);
        opacity: 1;
      }

      100% {
        filter: blur(12px);
        opacity: 0;
      }
    }

    /* ════════════════════════════════════════════
       Named animation classes (set dynamically)
       ════════════════════════════════════════════ */

    #overlay-root.anim-slide-left {
      animation: lt-slide-left 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.anim-slide-right {
      animation: lt-slide-right 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.anim-slide-up {
      animation: lt-slide-up 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.anim-slide-down {
      animation: lt-slide-down 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.anim-fade-in {
      animation: lt-fade-in 0.18s ease-out forwards;
    }

    #overlay-root.anim-fade-up {
      animation: lt-fade-up 0.18s ease-out forwards;
    }

    #overlay-root.anim-fade-down {
      animation: lt-fade-down 0.18s ease-out forwards;
    }

    #overlay-root.anim-zoom-in {
      animation: lt-zoom-in 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.anim-bounce-in {
      animation: lt-bounce-in 0.24s ease-out forwards;
    }

    #overlay-root.anim-flip-in {
      animation: lt-flip-in 0.22s ease-out forwards;
    }

    #overlay-root.anim-blur-in {
      animation: lt-blur-in 0.18s ease-out forwards;
    }

    #overlay-root.anim-none {
      opacity: 1;
    }

    /* Legacy compat */
    #overlay-root.slide-in {
      animation: lt-slide-left 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-root.slide-out {
      animation: lt-slide-out-right 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    #overlay-root.fade-in {
      animation: lt-fade-in 0.16s ease-out forwards;
    }

    #overlay-root.fade-out {
      animation: lt-fade-scale-out 0.4s ease-in forwards;
    }

    /* Reverse exit classes (matching entry animations) */
    #overlay-root.exit-slide-left {
      animation: lt-slide-out-left 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    #overlay-root.exit-slide-right {
      animation: lt-slide-out-right 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    #overlay-root.exit-slide-up {
      animation: lt-slide-out-up 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    #overlay-root.exit-slide-down {
      animation: lt-slide-out-down 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    #overlay-root.exit-fade-in {
      animation: lt-fade-out 0.4s ease-in forwards;
    }

    #overlay-root.exit-fade-up {
      animation: lt-fade-out-down 0.4s ease-in forwards;
    }

    #overlay-root.exit-fade-down {
      animation: lt-fade-out-up 0.4s ease-in forwards;
    }

    #overlay-root.exit-zoom-in {
      animation: lt-zoom-out 0.4s ease-in forwards;
    }

    #overlay-root.exit-bounce-in {
      animation: lt-bounce-out 0.5s ease-in forwards;
    }

    #overlay-root.exit-flip-in {
      animation: lt-flip-out 0.5s ease-in forwards;
    }

    #overlay-root.exit-blur-in {
      animation: lt-blur-out 0.4s ease-in forwards;
    }

    #overlay-root.exit-none {
      animation: lt-fade-out 0.3s ease-in forwards;
    }
  </style>

  <!-- Kinetic lower thirds (GSAP-driven name straps, see public/kinetic/) -->
  <script src="/kinetic/gsap.min.js"></script>
  <script src="/kinetic/kinetic-lower-thirds.js?v=6"></script>
  <script src="/kinetic/subscribe-lower-thirds.js?v=1"></script>
  <script src="/kinetic/church-lower-thirds.js?v=4"></script>
  <script src="/kinetic/sunday-lower-thirds.js?v=3"></script>
  <script src="/kinetic/stream-lower-thirds.js?v=2"></script>
  <script src="/kinetic/mce-graphic-packages.js?v=4"></script>
  <script>
    /**
     * Lower Third Overlay — MakeChurchEazy
     *
     * Receives theme data + variable values via URL hash:
     *   #data=<encoded JSON>
     *
     * JSON payload:
     *   {
     *     themeId: string,
     *     html: string,       // Theme HTML template
     *     css: string,        // Theme CSS
     *     values: Record<string, string>,  // Variable values
     *     live: boolean,
     *     blanked: boolean,
     *     size: string,       // "sm" | "md" | "lg" | "xl" | "2xl" | "3xl"
     *     scale: number,      // Visual scale factor (from size)
     *     timestamp: number
     *   }
     *
     * Variables in the HTML are replaced: {{key}} → value
     */

    let currentThemeId = null;
    let currentThemePayload = null;
    let pendingThemePayload = null;
    let isVisible = false;
    let isExiting = false;
    let fitRafId = 0;
    let fitRetryTimerId = 0;

    // ── XSS prevention ────────────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Kinetic straps can take themselves off air after N seconds (Dock: "Animate out after").
    var kineticAutoOutTimer = null;
    var kineticLoopToken = 0; // bumped by every new overlay command so a running loop stops
    function clearKineticAutoOut() {
      if (kineticAutoOutTimer) {
        clearTimeout(kineticAutoOutTimer);
        kineticAutoOutTimer = null;
      }
    }
    function scheduleKineticAutoOut(root, entryMs) {
      clearKineticAutoOut();
      var el = root && root.querySelector(".kx-root");
      if (!el) return;
      var raw = el.getAttribute("data-v-kx-auto-out");
      // Payloads saved before this setting existed still carry the {{kxAutoOut}} placeholder: use the 5s default.
      var seconds = raw == null || /^\{\{/.test(raw) ? 5 : parseFloat(raw);
      // Graphics that cycle through a set (Social Handles) publish how long one cycle takes.
      // The Dock's "Cycles" setting then replaces the seconds: N cycles, then out. 0 = keep looping.
      var cycleSec = parseFloat(el.getAttribute("data-kx-cycle-sec"));
      if (isFinite(cycleSec) && cycleSec > 0) {
        var rawCycles = el.getAttribute("data-v-kx-cycles");
        if (rawCycles == null || /^\{\{/.test(rawCycles)) {
          var liveValues = (currentThemePayload && currentThemePayload.values) || {};
          rawCycles = liveValues.kxCycles;
        }
        var cycles = rawCycles == null || String(rawCycles).trim() === "" ? 1 : parseFloat(rawCycles);
        if (!isFinite(cycles)) cycles = 1;
        if (cycles <= 0) return;
        // Go out a moment before the cycle wraps, while the last item is still fully on screen.
        seconds = Math.max(1, Math.round(cycles) * cycleSec - 1);
      } else if (!isFinite(seconds) || seconds <= 0) {
        return;
      }
      // Live text edits keep the same timer; a new show or any hide replaces/clears it.
      kineticAutoOutTimer = setTimeout(function () {
        kineticAutoOutTimer = null;
        if (!isVisible || isExiting) return;
        var live = root.querySelector(".kx-root");
        var loop = !!(live && live.getAttribute("data-v-kx-loop") === "1");
        var payload = currentThemePayload;
        if (!loop || !payload) {
          animateCurrentOverlayOut();
          return;
        }
        // "Loop auto": play out, pause briefly, play in again, until any new command arrives.
        var token = kineticLoopToken;
        hideOverlay(root, payload, function () {
          setTimeout(function () {
            if (token !== kineticLoopToken || isVisible || isExiting) return;
            currentThemeId = payload.themeId || null;
            showOverlay(root, payload);
          }, 900);
        });
      }, (entryMs || 0) + seconds * 1000);
    }

    // Kinetic themes (.kx-root) are animated by window.MCEKinetic instead of CSS.
    // Returns the started animation's length in ms, or 0 when the theme is not kinetic.
    function runKinetic(root, state) {
      try {
        if (!root || !window.MCEKinetic || !root.querySelector(".kx-root")) return 0;
        return window.MCEKinetic.run(root, state) || 0;
      } catch (err) {
        console.warn("[LT-Overlay] Kinetic theme failed:", err);
        return 0;
      }
    }

    const MIN_THEME_EXIT_DURATION_MS = 220;
    const BACKGROUND_SNAPSHOT_HOLD_MS = 180;
    const FAST_ENTRY_DURATION_MIN_MS = 90;
    const FAST_ENTRY_DURATION_MAX_MS = 180;
    const FAST_ENTRY_DELAY_MAX_MS = 180;
    let backgroundSnapshotTimer = null;

    /**
     * Replace all {{variable}} placeholders in template HTML
     */
    // ── Per-text soft styling ("<key>__style": case=upper;size=120;weight=bold;italic=1;spacing=wide).
    // Keep in step with src/lowerthirds/textStyle.ts.
    var TS_WEIGHTS = { light: "300", normal: "400", semibold: "600", bold: "700", black: "900" };
    var TS_SPACING = { tight: "-0.02em", wide: "0.06em", wider: "0.16em" };
    function parseTextStyle(raw) {
      var st = { textCase: "none", size: 100, weight: "", italic: false, spacing: "" };
      var text = typeof raw === "string" ? raw : "";
      if (!text || text.indexOf("{{") === 0) return st;
      text.split(";").forEach(function (part) {
        var kv = part.split("="); var k = (kv[0] || "").trim(); var v = (kv[1] || "").trim();
        if (k === "case") st.textCase = v;
        else if (k === "size" && isFinite(Number(v))) st.size = Math.min(180, Math.max(60, Math.round(Number(v))));
        else if (k === "weight") st.weight = TS_WEIGHTS[v] || "";
        else if (k === "italic") st.italic = v === "1" || v === "true";
        else if (k === "spacing") st.spacing = TS_SPACING[v] || "";
      });
      return st;
    }
    function applyTextCase(text, textCase) {
      var value = String(text == null ? "" : text);
      if (textCase === "upper") return value.toUpperCase();
      if (textCase === "lower") return value.toLowerCase();
      if (textCase === "title") return value.toLowerCase().replace(/(?<=^|[\s\-/(|]|(?:^|[\s(])["'\u201c\u2018])\p{L}/gu, function (ch) { return ch.toUpperCase(); });
      if (textCase === "sentence") return value.toLowerCase().replace(/(^\s*|[.!?|]\s+)(\p{L})/gu, function (_m, sep, ch) { return sep + ch.toUpperCase(); });
      return value;
    }
    function textStyleCss(st) {
      var css = [];
      if (st.textCase && st.textCase !== "none") css.push("text-transform:none!important");
      if (st.size !== 100) css.push("font-size:" + st.size + "%!important");
      if (st.weight) css.push("font-weight:" + st.weight + "!important");
      if (st.italic) css.push("font-style:italic!important");
      if (st.spacing) css.push("letter-spacing:" + st.spacing + "!important");
      return css.join(";");
    }

    // Same `*word*` / `*[#hex]word*` highlight markup the Scripture overlays use (e.g.
    // mce-multiview-scripture-circle.html's safeEmText). Runs on already-escaped text only.
    // Keep in step with applyHighlightMarkup in src/lowerthirds/textStyle.ts.
    var HIGHLIGHT_MARKUP_KEYS = { quote: true };
    function applyHighlightMarkup(escapedText) {
      return escapedText.replace(/\*(?=\S)(?:\[(#[0-9a-fA-F]{3,8})\])?([^*\n]*?\S)\*/g, function (_m, color, words) {
        return color
          ? '<strong class="lt-em" style="color:' + color + '">' + words + '</strong>'
          : '<strong class="lt-em">' + words + '</strong>';
      });
    }

    function substituteVariables(html, values) {
      if (!values || typeof values !== "object") return html;
      return html.replace(/\{\{(\w+)\}\}/g, (match, key, offset) => {
        if (!values.hasOwnProperty(key)) return match;
        if (/__style$/.test(key)) return escapeHtml(values[key]);
        const st = parseTextStyle(values[key + "__style"]);
        // Inside a tag (an attribute such as data-v-name) only the letter case applies — real
        // <strong> markup there would break the attribute's quoting.
        const insideTag = html.lastIndexOf("<", offset) > html.lastIndexOf(">", offset);
        let escaped = escapeHtml(applyTextCase(values[key], st.textCase));
        if (!insideTag && HIGHLIGHT_MARKUP_KEYS[key]) escaped = applyHighlightMarkup(escaped);
        const css = textStyleCss(st);
        if (!css || insideTag) return escaped;
        return '<span class="lt-ts" style="' + css + '">' + escaped + "</span>";
      });
    }

    function wrapThemeHtml(templateHtml, values, forcedState) {
      return '<div class="lt-fit-frame">' + renderThemeHtml(templateHtml, values, forcedState) + '</div>';
    }

    /**
     * Apply size, font size override, and height to the overlay root.
     * Uses CSS custom properties to control the inner content width.
     * Font scaling sets the <html> root font-size so Tailwind rem-based
     * classes (text-2xl, text-sm, etc.) all scale proportionally.
     */
    function applySize(root, widthPct, fontScale, fontSizeScale, heightPx, visualScale, sizeScale) {

      if (widthPct) {
        let new_one = Math.max(0, widthPct);
        root.setAttribute("data-size", String(new_one));
        root.style.setProperty("--lt-width", new_one + "%");

      var overrideEl = document.getElementById("animation-override");
      if (!overrideEl) {
        overrideEl = document.createElement("style");
        overrideEl.id = "animation-override";
        document.head.appendChild(overrideEl);
      }
      var overrideCss = "";
      if (data.animationIn && data.animationIn !== "none") {
        var entryKeyframe = "lt-" + data.animationIn;
        // Use animation shorthand with !important to reliably beat the theme's
        // animation shorthand (avoids Chromium longhand/short-hand override edge case)
        var entryProps = "animation:" + entryKeyframe + " 0.45s cubic-bezier(0.16,1,0.3,1) forwards !important;";
        // Standard .lt themes — the root element itself is animated
        overrideCss += "#overlay-root .lt[data-state=\"in\"]{" + entryProps + "}";
        // .b-lt and .ylt themes — override animated children with !important
        overrideCss += "#overlay-root .b-lt[data-state=\"in\"] .b-shell," +
          "#overlay-root .b-lt[data-state=\"in\"] .b-e1," +
          "#overlay-root .b-lt[data-state=\"in\"] .b-e2," +
          "#overlay-root .ylt[data-state=\"in\"] .y-shell," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-1," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-2," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-3{" + entryProps + "}";
      } else if (data.animationIn === "none") {
        overrideCss += "#overlay-root .lt[data-state=\"in\"]{animation:none !important;opacity:1 !important;}";
        overrideCss += "#overlay-root .b-lt[data-state=\"in\"] .b-shell," +
          "#overlay-root .b-lt[data-state=\"in\"] .b-e1," +
          "#overlay-root .b-lt[data-state=\"in\"] .b-e2," +
          "#overlay-root .ylt[data-state=\"in\"] .y-shell," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-1," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-2," +
          "#overlay-root .ylt[data-state=\"in\"] .y-enter-3{animation:none !important;opacity:1 !important;}";
      }
      if (data.exitStyle) {
        var exitKeyframe = "lt-fade-out";
        var exitDuration = "0.4s";
        var exitTiming = "ease-in";
        if (data.exitStyle === "exit-slide-down") {
          exitKeyframe = "lt-slide-out-down";
          exitDuration = "0.5s";
          exitTiming = "cubic-bezier(0.7,0,0.84,0)";
        } else if (data.exitStyle === "exit-none") {
          exitDuration = "0.15s";
        }
        var exitProps = "animation:" + exitKeyframe + " " + exitDuration + " " + exitTiming + " forwards !important;";
        overrideCss += "#overlay-root .lt[data-state=\"out\"]{" + exitProps + "}";
        overrideCss += "#overlay-root .b-lt[data-state=\"out\"] .b-shell," +
          "#overlay-root .b-lt[data-state=\"out\"] .b-e1," +
          "#overlay-root .b-lt[data-state=\"out\"] .b-e2," +
          "#overlay-root .ylt[data-state=\"out\"] .y-shell," +
          "#overlay-root .ylt[data-state=\"out\"] .y-enter-1," +
          "#overlay-root .ylt[data-state=\"out\"] .y-enter-2," +
          "#overlay-root .ylt[data-state=\"out\"] .y-enter-3{" + exitProps + "}";
      }
      overrideEl.textContent = overrideCss;

      // Debug: verify animation override is applied
      console.log("[LT Override] animationIn:", data.animationIn, "| exitStyle:", data.exitStyle, "| overrideCss length:", overrideCss.length);

      // Body stays transparent (custom bg is handled inside the LT element)
      document.body.style.background = "transparent";

      // If same theme and already visible, just update content (no re-animation)
      if (themeId === currentThemeId && isVisible) {
        const canFreezeBackground = getBackgroundSnapshotSignature(currentThemePayload) === getBackgroundSnapshotSignature(data);
        if (canFreezeBackground) {
          captureBackgroundSnapshot(root);
        } else {
          clearBackgroundSnapshot();
        }
        root.innerHTML = wrapThemeHtml(html || "", values || {}, "in");
        root.className = "";
        applySize(root, data.widthPct, data.fontScale, data.fontSizeScale, data.heightPx, data.visualScale, data.scale);
        applyCustomStyles(root, data);
        applyPosition(root, data);
        // Live text edits on a kinetic strap update in place (no re-entrance).
        runKinetic(root, "hold");
        scheduleFitOverlay(root);
        currentThemePayload = {
          ...data,
          values: { ...(values || {}) },
        };
        if (canFreezeBackground) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              releaseBackgroundSnapshot();
            });
          });
        }
        return;
      }

      // Different theme — slide out old, then slide in new
      if (isVisible && currentThemeId !== themeId) {
        clearBackgroundSnapshot();
        const previousPayload = currentThemePayload;
        hideOverlay(root, previousPayload, () => {
          currentThemeId = themeId;
          showOverlay(root, data);
        });
      } else {
        // First show — theme-controlled "in" state
        clearBackgroundSnapshot();
        currentThemeId = themeId;
        showOverlay(root, data);
      }
    }

    /**
     * Parse data from URL hash
     */
    function parseHashData() {
      try {
        const hash = window.location.hash;
        if (!hash || !hash.includes("data=")) return null;
        const encoded = hash.split("data=")[1];
        if (!encoded) return null;
        return JSON.parse(decodeURIComponent(encoded));
      } catch (err) {
        console.warn("[LT-Overlay] Failed to parse hash data:", err);
        return null;
      }
    }

    /**
     * Handle hash change — new data pushed
     */
    function onHashChange() {
      const data = parseHashData();
      if (data) {
        applyTheme(data);
      }
    }

    // Listen for hash changes (OBS updates the URL)
    window.addEventListener("hashchange", onHashChange);

    // Initial load
    window.addEventListener("DOMContentLoaded", () => {
      const data = newerThemePayload(parseHashData(), readCssOverlayData());
      if (data) {
        applyTheme(data);
      }
    });

    function setupOverlayResizeObserver() {
      if (!window.ResizeObserver) return;
      const resizeObserver = new ResizeObserver(() => {
        const root = document.getElementById("overlay-root");
        if (root) scheduleFitOverlay(root);
      });
      if (document.body) resizeObserver.observe(document.body);
      const root = document.getElementById("overlay-root");
      if (root) resizeObserver.observe(root);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupOverlayResizeObserver, { once: true });
    } else {
      setupOverlayResizeObserver();
    }

    // ════════════════════════════════════════════
    // Countdown timer engine
    // ════════════════════════════════════════════
    let countdownInterval = null;

    function startCountdown(root, values) {
      // Stop any previous countdown
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      // Parse hours, minutes, seconds from values
      const hours = parseInt(values.hours || "0", 10) || 0;
      const minutes = parseInt(values.minutes || "0", 10) || 0;
      const seconds = parseInt(values.seconds || "0", 10) || 0;
      let totalSeconds = hours * 3600 + minutes * 60 + seconds;

      if (totalSeconds <= 0) return;

      function formatTime(secs) {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) {
          return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function updateDisplay() {
        // Find the countdown display element in the overlay
        const el = root.querySelector("[data-countdown]") || root.querySelector(".countdown-display");
        if (el) {
          el.textContent = formatTime(totalSeconds);
        }
      }

      updateDisplay();

      countdownInterval = setInterval(() => {
        totalSeconds--;
        if (totalSeconds <= 0) {
          totalSeconds = 0;
          clearInterval(countdownInterval);
          countdownInterval = null;
          // Show "LIVE" or finished state
          const el = root.querySelector("[data-countdown]") || root.querySelector(".countdown-display");
          if (el) el.textContent = "00:00";
        }
        updateDisplay();
      }, 1000);
    }

    // Hook into applyTheme to detect countdown themes
    const _origApplyTheme = applyTheme;
    applyTheme = function (data) {
      _origApplyTheme(data);
      // After rendering, load any dynamic fonts the theme needs
      if (data && data.fontImports && Array.isArray(data.fontImports)) {
        loadDynamicFonts(data.fontImports);
      }
      // After rendering, check if this is a countdown theme
      if (data && data.themeId && data.themeId.includes("countdown") && data.live && !data.blanked) {
        const root = document.getElementById("overlay-root");
        setTimeout(() => startCountdown(root, data.values || {}), 100);
      }
      // After rendering, check if this is a social-loop theme and start cycling
      if (data && data.themeId && data.themeId.includes("social-loop") && data.live && !data.blanked) {
        const root = document.getElementById("overlay-root");
        setTimeout(() => startSocialLoop(root, data.values || {}), 150);
      }
    };

    // ════════════════════════════════════════════
    // Dynamic Font / CSS Loader
    // ════════════════════════════════════════════
    var loadedFonts = {};
    function loadDynamicFonts(imports) {
      var container = document.getElementById("dynamic-fonts");
      if (!container) return;
      for (var i = 0; i < imports.length; i++) {
        var url = imports[i];
        if (loadedFonts[url]) continue;
        // Skip CDN URLs — Google Fonts and Font Awesome are already loaded locally via <head> stylesheets
        if (url.indexOf("https://fonts.googleapis.com") === 0) continue;
        if (url.indexOf("https://fonts.gstatic.com") === 0) continue;
        if (url.indexOf("https://cdnjs.cloudflare.com") === 0) continue;
        if (url === "/fonts/google/google-fonts.css") continue;
        if (url === "/fonts/fontawesome/all.min.css") continue;
        if (url === "/fonts/cmg-sans-fonts.css") continue;
        loadedFonts[url] = true;
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = url;
        container.appendChild(link);
      }
    }

    // ════════════════════════════════════════════
    // Social Loop cycling engine
    // ════════════════════════════════════════════
    var socialLoopInterval = null;

    function startSocialLoop(root, values) {
      // Stop any previous loop
      if (socialLoopInterval) {
        clearInterval(socialLoopInterval);
        socialLoopInterval = null;
      }

      // Try both sl-item (lower-third) and sl-fs-item (fullscreen)
      var items = root.querySelectorAll(".sl-item");
      var isFullscreen = false;
      if (!items.length) {
        items = root.querySelectorAll(".sl-fs-item");
        isFullscreen = true;
      }
      if (!items.length) return;

      var speedSec = parseInt(values.speed) || 3;
      var loopVal = values.loop || "infinite";
      var maxCycles = loopVal === "infinite" ? -1 : (parseInt(loopVal) || 2);
      var idx = 0;
      var cycles = 0;

      function show() {
        for (var i = 0; i < items.length; i++) {
          var el = items[i];
          if (isFullscreen) {
            el.setAttribute("data-active", i === idx ? "true" : "false");
            el.style.opacity = i === idx ? "1" : "0";
            el.style.transform = i === idx ? "scale(1)" : "scale(0.96)";
          } else {
            el.style.opacity = i === idx ? "1" : "0";
            el.style.transform = i === idx ? "translateY(0)" : "translateY(18px)";
          }
        }
      }

      // Initial show
      show();

      socialLoopInterval = setInterval(function () {
        idx++;
        if (idx >= items.length) {
          idx = 0;
          cycles++;
        }
        if (maxCycles > 0 && cycles >= maxCycles) {
          // Hide all and stop
          for (var i = 0; i < items.length; i++) {
            items[i].style.opacity = "0";
          }
          clearInterval(socialLoopInterval);
          socialLoopInterval = null;
          return;
        }
        show();
      }, speedSec * 1000);
    }

    const routeSource = new URLSearchParams(window.location.search).get("mceSource") || "";
    const lowerThirdChannel = `ocs-lower-third${routeSource ? `:${routeSource}` : ""}`;

    // Also listen for BroadcastChannel messages (for local preview)
    try {
      const bc = new BroadcastChannel(lowerThirdChannel);
      bc.onmessage = (e) => {
        if (e.data && e.data.type === "animate-out") {
          animateCurrentOverlayOut();
          return;
        }
        if (e.data && e.data.type === "lt-update") {
          applyTheme(e.data.payload);
        }
      };
    } catch (err) {
      // BroadcastChannel not available in all contexts
    }

    function readFromObsBrowserEvent(event) {
      try {
        const detail = event && typeof event.detail === "object" ? event.detail : null;
        const data = detail && typeof detail.event_data === "object" ? detail.event_data : detail;
        if (!data || typeof data !== "object") return false;
        if (data.tab && data.tab !== "lower-third") return false;
        const targetSource = typeof data.targetSource === "string" ? data.targetSource : "";
        if (routeSource && targetSource !== routeSource) return false;
        const packet = data.packet || data.overlayData || data.data;
        if (!packet || typeof packet !== "object") return false;
        if (packet.action === "animate-out") {
          const handled = animateCurrentOverlayOut();
          writeRenderAck(packet, "animate-out");
          return handled;
        }
        // Empty the page at once. The Dock sends this just before it hides the source,
        // so OBS keeps an empty picture instead of a half-finished exit of the old graphic.
        if (packet.action === "clear") {
          applyTheme(null);
          writeRenderAck(packet, "clear");
          return true;
        }
        applyTheme(packet);
        writeRenderAck(packet, "lower-third");
        return true;
      } catch { }
      return false;
    }

    window.addEventListener("mce-overlay-packet", readFromObsBrowserEvent);

    // Listen for animate-out via window.postMessage (for iframe/parent communication)
    window.addEventListener("message", (e) => {
      if (e.data && e.data.action === "animate-out") {
        animateCurrentOverlayOut();
      }
    });

    // Detect exit animation completion and signal the desktop app
    document.addEventListener("animationend", (e) => {
      var root = document.getElementById("overlay-root");
      if (!root) return;
      var target = e.target;
      // Check if the animated element has data-state="out" (exit animation)
      if (target.getAttribute && target.getAttribute("data-state") === "out") {
        try {
          var bc = new BroadcastChannel(lowerThirdChannel);
          bc.postMessage({ type: "lower-third-animation-complete", state: "out" });
          bc.close();
        } catch (err) {
          // BroadcastChannel not available
        }
      }
    });
  </script>
<style id="mce-no-video-ui">
/* Never show the browser's own play button or video controls (the overlay plays its videos itself). */
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-play-button { display: none !important; opacity: 0 !important; visibility: hidden !important; -webkit-appearance: none !important; pointer-events: none !important; }
video { outline: none; }
</style>
</head>

<body>
  <div id="overlay-bg-buffer" class="hidden-state" aria-hidden="true"></div>
  <div id="overlay-root" class="hidden-state"></div>
</body>

</html>

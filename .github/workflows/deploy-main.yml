name: Deploy — Production (main)

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  APP_ENV: production

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify-desktop:
    name: Verify & Build Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_AUTH_API_URL: ${{ secrets.PROD_AUTH_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL }}

  deploy-api:
    name: Deploy API (Cloudflare)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Configure API runtime secrets
        run: |
          for key in FLW_PUBLIC_KEY FLW_SECRET_KEY FLW_ENCRYPTION_KEY CLOUDFLARE_STREAM_ACCOUNT_ID CLOUDFLARE_STREAM_API_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing production secret: $key"
              exit 1
            fi
            printf '%s' "${!key}" | npx wrangler secret put "$key"
          done
          if [ -n "$PAYSTACK_SECRET_KEY" ]; then
            printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TOKEN }}
          FLW_PUBLIC_KEY: ${{ secrets.PROD_FLW_PUBLIC_KEY }}
          FLW_SECRET_KEY: ${{ secrets.PROD_FLW_SECRET_KEY }}
          FLW_ENCRYPTION_KEY: ${{ secrets.PROD_FLW_ENCRYPTION_KEY }}
          CLOUDFLARE_STREAM_ACCOUNT_ID: ${{ secrets.PROD_CLOUDFLARE_STREAM_ACCOUNT_ID }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_STREAM_API_TOKEN }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PROD_PAYSTACK_SECRET_KEY }}
      - name: Deploy API Container Worker to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TOKEN }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.PROD_APP_URL }}
          MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.PROD_AUTH_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}

  deploy-dashboard:
    name: Deploy Dashboard (Cloudflare)
    needs: [deploy-api]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Build & Deploy Dashboard to Cloudflare
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TOKEN }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}

  deploy-worker:
    name: Deploy Bible API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: bible_backend/package-lock.json
      - name: Deploy Bible API Worker
        working-directory: bible_backend
        run: npm ci && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TOKEN }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [verify-desktop, deploy-api, deploy-dashboard, deploy-worker]
    steps:
      - run: |
          echo "Smoke tests would run here against production URLs"
          echo "Production deploy completed"

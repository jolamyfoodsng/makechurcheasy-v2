name: Deploy — Test MCE (develop)

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: "22"
  APP_ENV: development

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  verify-desktop:
    name: Verify & Build Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_APP_ENV: development
          VITE_AUTH_API_URL: ${{ secrets.DEV_AUTH_API_URL || 'http://localhost:3004' }}
          VITE_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL || 'http://localhost:3004' }}
          VITE_WS_URL: ${{ secrets.DEV_WS_URL || 'ws://localhost:3004' }}

  build-api:
    name: Build API (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_APP_URL: http://localhost:4000
          MONGODB_URI: mongodb://localhost:27017/makechurcheasy
          AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          FLW_PUBLIC_KEY: ${{ secrets.DEV_FLW_PUBLIC_KEY }}
          FLW_SECRET_KEY: ${{ secrets.DEV_FLW_SECRET_KEY }}
          FLW_ENCRYPTION_KEY: ${{ secrets.DEV_FLW_ENCRYPTION_KEY }}

  build-dashboard:
    name: Build Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_API_URL || 'http://localhost:3004' }}
          BACKEND_URL: ${{ secrets.DEV_BACKEND_URL || 'http://localhost:3004' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: bible_backend/package-lock.json
      - name: Deploy API Router (develop)
        working-directory: api/cloudflare-api-router
        run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
      - name: Deploy Bible API Worker
        working-directory: bible_backend
        run: npm ci && npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [verify-desktop, build-api, build-dashboard, deploy-worker]
    steps:
      - run: |
          echo "Smoke tests would run here against test URLs"
          echo "Deploy to test frontend completed"
